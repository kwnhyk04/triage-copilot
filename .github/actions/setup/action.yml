name: setup
description: Node 24 with pnpm, uv with Python 3.12, the locked dependencies, and CI's .env.
runs:
  using: composite
  steps:
    # pnpm's version comes from package.json's packageManager.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: 0.12.23
        enable-cache: true
    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        uv sync --locked
    - name: Write CI's .env
      shell: bash
      run: sh scripts/ci_env.sh
