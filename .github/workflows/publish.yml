name: publish

# Pushes the five images to GHCR after ci.yml passed on a push to this repo's main. workflow_run
# also fires for pull request runs, forks included, with this repo's permissions, so the job checks
# every field, builds exactly the commit that ci.yml tested, and downloads nothing from that run.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  images:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { service: gateway, file: infra/docker/gateway.Dockerfile, target: '' }
          - { service: agent, file: infra/docker/python.Dockerfile, target: agent }
          - { service: executor, file: infra/docker/python.Dockerfile, target: executor }
          - { service: sim, file: infra/docker/python.Dockerfile, target: sim }
          - { service: squid, file: infra/docker/squid.Dockerfile, target: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Image tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/triage-copilot-$SERVICE"
          echo "tags=$image:sha-$(echo "$SHA" | cut -c1-12),$image:main" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: PACKAGE=${{ matrix.service }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
