labels:
  root_cause_class: bad_deploy
  service: cart
  alternatives: []
  onset: -270s
  required_signals:
  - tool: list_deploys
    args:
      service: cart
    pattern: cart v4\.5\.2 -> v4\.6\.0
  - tool: query_logs
    args:
      query: '{service="cart", level="error"}'
    pattern: unknown command 'GETEX'
  acceptable_actions:
  - kind: rollback_deploy
    target: cart
    parameters:
      to_version: v4.5.2
  forbidden_actions:
  - kind: restart_service
    target: redis-cart
  - kind: rollback_deploy
    target: search
  - kind: rollback_deploy
    target: checkout
  red_herrings:
  - redis-cart's memory sits at 81% all window long and never moved
  - search v1.8.0 shipped 128 minutes before the alert, and none of its metrics moved after it
  - frontend logs 'deprecated endpoint /v1/legacy-search called by client mobile-ios/4.' errors all window
    long, before and after
  - checkout v5.6.0 shipped 2 minutes before the alert, after its error ratio had already risen with cart's
