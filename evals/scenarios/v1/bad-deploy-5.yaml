id: bad-deploy-5
title: cart v4.6.0 calls a Redis command too new
seed: 90228
alert:
  labels:
    alertname: CartHighErrorRate
    service: cart
    severity: critical
  annotations:
    summary: cart 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="cart"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: cart
    op: '>'
    threshold: 0.05
    for: 2m
services:
  frontend:
    depends_on:
    - cart
    - catalog
  checkout:
    depends_on:
    - cart
  cart:
    depends_on:
    - redis-cart
    - catalog
    - coredns
  redis-cart: {}
  catalog: {}
  search: {}
  coredns: {}
  nightly-backup: {}
