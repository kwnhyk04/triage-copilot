id: db-pool-exhaustion-3
title: a bad plan on inventory-db
seed: 21003
alert:
  labels:
    alertname: InventoryHighLatency
    service: inventory
    severity: warning
  annotations:
    summary: inventory p99 latency above 2 s for 3 minutes
    description: http_latency_p99_seconds{service="inventory"} > 2 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: inventory
    op: '>'
    threshold: 2.0
    for: 3m
services:
  checkout:
    depends_on:
    - inventory
  orders:
    depends_on:
    - inventory
  inventory:
    depends_on:
    - inventory-db
    - coredns
  inventory-db: {}
  notifications: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: inventory
  version: v2.8.1
  previous_version: v2.8.0
  at: -40m
  author: ana.lopez
  change: Add a stock export metric
- service: notifications
  version: v6.13.0
  previous_version: v6.12.1
  at: -123m
  author: renovate-bot
  change: Bump dependencies
- service: orders
  version: v5.19.0
  previous_version: v5.18.4
  at: -3m
  author: maria.g
  change: Update header copy and footer links
background_deploys_days: 7
