- labels:
    service: inventory
    level: info
  per_minute: 2
  from: -40m
  to: -39m
  lines:
  - 'Rolling update: pod inventory-{rid} started version=v2.8.1'
- labels:
    service: inventory-db
    level: info
  per_minute: 1
  from: -10m
  to: -9m
  lines:
  - automatic analyze of table "inventory.public.stock_levels"
- labels:
    service: inventory-db
    level: warn
  per_minute: 20
  from: -9m
  lines:
  - 'duration: 8423.117 ms  statement: SELECT * FROM stock_levels WHERE sku = $1 AND warehouse_id = $2'
  - 'duration: 9105.402 ms  statement: SELECT * FROM stock_levels WHERE sku = $1 AND warehouse_id = $2'
- labels:
    service: inventory
    level: warn
  per_minute: 6
  from: -6m
  lines:
  - connection pool inventory-db at 20/20 connections, {n} requests waiting
  asserts:
  - metric: db_pool_in_use
    labels:
      service: inventory
    op: '>='
    value: 19
- labels:
    service: inventory
    level: error
  per_minute: 30
  from: -6m
  lines:
  - timeout acquiring connection from pool after 5000ms (pool=inventory-db, active=20, idle=0) request_id={rid}
  - 'request failed: PoolTimeoutException request_id={rid}'
  asserts:
  - metric: db_pool_in_use
    labels:
      service: inventory
    op: '>='
    value: 19
- labels:
    service: notifications
    level: info
  per_minute: 2
  from: -123m
  to: -122m
  lines:
  - 'Rolling update: pod notifications-{rid} started version=v6.13.0'
- labels:
    service: orders
    level: error
  per_minute: 23
  lines:
  - 'thumbnail generation failed for sku={n}: unsupported color profile'
- labels:
    service: orders
    level: info
  per_minute: 2
  from: -3m
  to: -2m
  lines:
  - 'Rolling update: pod orders-{rid} started version=v5.19.0'
- labels:
    service: inventory
    level: info
  per_minute: 1
  from: -4m
  to: -3m
  lines:
  - 'config reloaded from config-service: inventory.low_stock_email.threshold=5 (was 3), changed by ops-bot'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-4
labels:
  root_cause_class: database
  service: inventory-db
  alternatives: []
  onset: -10m
  required_signals:
  - tool: query_metrics
    args:
      query: db_slow_queries_per_second{service="inventory-db"}
    pattern: db_slow_queries_per_second\{service="inventory-db"\}
  - tool: query_logs
    args:
      query: '{service="inventory-db", level="warn"}'
    pattern: FROM stock_levels WHERE sku
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: inventory-db
  - kind: rollback_deploy
    target: inventory
  - kind: rollback_deploy
    target: notifications
  - kind: rollback_deploy
    target: orders
  red_herrings:
  - inventory v2.8.1 shipped 40 minutes before the alert and only added a metric
  - notifications v6.13.0 shipped 123 minutes before the alert, and none of its metrics moved after it
  - orders logs 'thumbnail generation failed for sku=' errors all window long, before and after
  - orders v5.19.0 shipped 3 minutes before the alert, and none of its metrics moved after it
  - inventory's config key inventory.low_stock_email.threshold changed 4 minutes before the alert, after
    its latency had already risen
