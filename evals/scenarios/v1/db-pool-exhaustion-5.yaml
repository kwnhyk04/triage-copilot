id: db-pool-exhaustion-5
title: an ad hoc query saturates catalog-db
seed: 40190
alert:
  labels:
    alertname: CatalogHighLatency
    service: catalog
    severity: warning
  annotations:
    summary: catalog p99 latency above 1.5 s for 3 minutes
    description: http_latency_p99_seconds{service="catalog"} > 1.5 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: catalog
    op: '>'
    threshold: 1.5
    for: 3m
services:
  frontend:
    depends_on:
    - catalog
    - search
  search:
    depends_on:
    - catalog
  catalog:
    depends_on:
    - catalog-db
    - coredns
  catalog-db: {}
  recommendations: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: recommendations
  version: v4.13.0
  previous_version: v4.12.6
  at: -125m
  author: dev.kim
  change: Update header copy and footer links
- service: search
  version: v7.13.0
  previous_version: v7.12.7
  at: -4m
  author: ci-bot
  change: Update header copy and footer links
background_deploys_days: 7
