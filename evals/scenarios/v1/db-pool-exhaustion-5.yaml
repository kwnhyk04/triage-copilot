logs:
- labels:
    service: frontend
    level: info
  per_minute: 10
  lines:
  - GET / 200 {ms}ms request_id={rid}
  - GET /product/{n} 200 {ms}ms request_id={rid}
  - GET /cart 200 {ms}ms request_id={rid}
- labels:
    service: search
    level: info
  per_minute: 8
  lines:
  - GET /search 200 {ms}ms request_id={rid}
  - GET /search/suggest 200 {ms}ms request_id={rid}
- labels:
    service: catalog
    level: info
  per_minute: 8
  lines:
  - GET /products/{n} 200 {ms}ms request_id={rid}
  - GET /categories 200 {ms}ms request_id={rid}
- labels:
    service: recommendations
    level: info
  per_minute: 13
  lines:
  - GET /recommendations/{n} 200 {ms}ms request_id={rid}
  - GET /recommendations/trending 200 {ms}ms request_id={rid}
- labels:
    service: catalog-db
    level: info
  per_minute: 3
  lines:
  - 'checkpoint complete: wrote {n} buffers'
- labels:
    service: catalog-db
    level: warn
  per_minute: 2
  from: -11m
  lines:
  - 'long-running query pid 30117 (user analyst, application psql) running for 9 min: SELECT p.*, count(*)
    FROM products p JOIN product_views v USING (sku) GROUP BY p.sku'
- labels:
    service: catalog
    level: warn
  per_minute: 6
  from: -6m
  lines:
  - connection pool catalog-db at 40/40 connections, {n} requests waiting
  asserts:
  - metric: db_pool_in_use
    labels:
      service: catalog
    op: '>='
    value: 39
- labels:
    service: catalog
    level: error
  per_minute: 30
  from: -6m
  lines:
  - timeout acquiring connection from pool after 5000ms (pool=catalog-db, active=40, idle=0) request_id={rid}
  - 'request failed: PoolTimeoutException request_id={rid}'
  asserts:
  - metric: db_pool_in_use
    labels:
      service: catalog
    op: '>='
    value: 39
- labels:
    service: recommendations
    level: info
  per_minute: 2
  from: -125m
  to: -124m
  lines:
  - 'Rolling update: pod recommendations-{rid} started version=v4.13.0'
- labels:
    service: search
    level: error
  per_minute: 33
  lines:
  - email template promo-weekly has no translation for locale pt-BR
- labels:
    service: search
    level: info
  per_minute: 2
  from: -4m
  to: -3m
  lines:
  - 'Rolling update: pod search-{rid} started version=v7.13.0'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-7
labels:
  root_cause_class: database
  service: catalog-db
  alternatives: []
  onset: -11m
  required_signals:
  - tool: query_metrics
    args:
      query: cpu_usage_ratio{service="catalog-db"}
    pattern: cpu_usage_ratio\{service="catalog-db"\}
  - tool: query_logs
    args:
      query: '{service="catalog-db", level="warn"}'
    pattern: pid 30117
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: catalog-db
  - kind: scale_service
    target: catalog
  - kind: rollback_deploy
    target: recommendations
  - kind: rollback_deploy
    target: search
  red_herrings:
  - recommendations v4.13.0 shipped 125 minutes before the alert, and none of its metrics moved after
    it
  - search logs 'email template promo-weekly has no translation for locale pt-BR' errors all window long,
    before and after
  - search v7.13.0 shipped 4 minutes before the alert, and none of its metrics moved after it
