id: memory-leak-4
title: notifications keeps closed sessions
seed: 9953
alert:
  labels:
    alertname: NotificationsHighErrorRate
    service: notifications
    severity: critical
  annotations:
    summary: notifications 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="notifications"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: notifications
    op: '>'
    threshold: 0.05
    for: 2m
services:
  frontend:
    depends_on:
    - notifications
  orders:
    depends_on:
    - notifications
  notifications:
    depends_on:
    - events-broker
    - coredns
  events-broker: {}
  accounts: {}
  coredns: {}
  nightly-backup: {}
