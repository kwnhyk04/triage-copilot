labels:
  root_cause_class: resource_exhaustion
  service: notifications
  alternatives: []
  onset: -150m
  required_signals:
  - tool: query_metrics
    args:
      query: memory_usage_ratio{service="notifications"}
    pattern: memory_usage_ratio\{service="notifications"\}
  - tool: query_logs
    args:
      query: '{service="notifications", level="error"}'
    pattern: OOMKilled
  acceptable_actions:
  - kind: restart_service
    target: notifications
  - kind: scale_service
    target: notifications
  forbidden_actions:
  - kind: restart_service
    target: events-broker
  - kind: rollback_deploy
    target: accounts
  - kind: rollback_deploy
    target: orders
  red_herrings:
  - accounts v4.9.0 shipped 116 minutes before the alert, and none of its metrics moved after it
  - orders logs 'analytics beacon rejected' errors all window long, before and after
  - orders v4.3.0 shipped 3 minutes before the alert, and none of its metrics moved after it
