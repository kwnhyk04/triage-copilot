id: memory-leak-1
title: orders' export cache never shrinks
seed: 19598
alert:
  labels:
    alertname: OrdersHighErrorRate
    service: orders
    severity: critical
  annotations:
    summary: orders 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="orders"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: orders
    op: '>'
    threshold: 0.05
    for: 2m
services:
  checkout:
    depends_on:
    - orders
  orders:
    depends_on:
    - orders-db
    - coredns
  frontend:
    depends_on:
    - checkout
  orders-db: {}
  catalog: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: frontend
  version: v1.14.0
  previous_version: v1.13.3
  at: -121m
  author: sam.okafor
  change: Bump dependencies
- service: checkout
  version: v1.13.0
  previous_version: v1.12.4
  at: -2m
  author: renovate-bot
  change: Tune log sampling
background_deploys_days: 7
