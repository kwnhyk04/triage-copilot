labels:
  root_cause_class: resource_exhaustion
  service: orders
  alternatives: []
  onset: -4h
  required_signals:
  - tool: query_metrics
    args:
      query: memory_usage_ratio{service="orders"}
    pattern: memory_usage_ratio\{service="orders"\}
  - tool: query_metrics
    args:
      query: container_restarts_total{service="orders"}
    pattern: container_restarts_total\{service="orders"\}
  - tool: query_logs
    args:
      query: '{service="orders", level="error"}'
    pattern: OOMKilled
  acceptable_actions:
  - kind: restart_service
    target: orders
  - kind: scale_service
    target: orders
  forbidden_actions:
  - kind: restart_service
    target: orders-db
  - kind: rollback_deploy
    target: frontend
  - kind: rollback_deploy
    target: checkout
  - kind: disable_feature_flag
    target: orders
    parameters:
      flag: order-notes-field
  red_herrings:
  - catalog's CPU spiked 50 to 42 minutes before the alert and settled
  - frontend v1.14.0 shipped 121 minutes before the alert, and none of its metrics moved after it
  - catalog logs 'email template promo-weekly has no translation for locale pt-BR' errors all window long,
    before and after
  - checkout v1.13.0 shipped 2 minutes before the alert, and none of its metrics moved after it
  - orders's flag order-notes-field changed 3 minutes before the alert, after its errors had begun
