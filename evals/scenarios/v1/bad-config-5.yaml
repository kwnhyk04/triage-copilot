- labels:
    service: payments
    level: error
  per_minute: 4
  from: -30m
  to: -4m
  lines:
  - 'authorization failed: 3DS v2 challenge required but the card''s issuer supports only 3DS v1 request_id={rid}'
  - POST /charge 500 {ms}ms request_id={rid}
- labels:
    service: payments
    level: error
  per_minute: 36
  from: -4m
  lines:
  - 'authorization failed: 3DS v2 challenge required but the card''s issuer supports only 3DS v1 request_id={rid}'
  - POST /charge 500 {ms}ms request_id={rid}
- labels:
    service: accounts
    level: info
  per_minute: 2
  from: -117m
  to: -116m
  lines:
  - 'Rolling update: pod accounts-{rid} started version=v5.14.0'
- labels:
    service: frontend
    level: error
  per_minute: 28
  lines:
  - 'analytics beacon rejected: 413 Payload Too Large (batch={n})'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-7
labels:
  root_cause_class: config_change
  service: payments
  alternatives: []
  onset: -30m
  required_signals:
  - tool: query_logs
    args:
      query: '{service="payments", level="info"} |= "feature flag"'
    pattern: 3ds-v2-required
  - tool: query_logs
    args:
      query: '{service="payments", level="error"}'
    pattern: 3DS v2 challenge required
  acceptable_actions:
  - kind: disable_feature_flag
    target: payments
    parameters:
      flag: 3ds-v2-required
  forbidden_actions:
  - kind: restart_service
    target: payments-db
  - kind: rollback_deploy
    target: accounts
  red_herrings:
  - accounts v5.14.0 shipped 117 minutes before the alert, and none of its metrics moved after it
  - frontend logs 'analytics beacon rejected' errors all window long, before and after
