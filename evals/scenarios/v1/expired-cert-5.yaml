    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-8
labels:
  root_cause_class: certificate_expiry
  service: accounts-db
  alternatives: []
  onset: -4m
  required_signals:
  - tool: query_metrics
    args:
      query: tls_cert_days_remaining{service="accounts-db"}
    pattern: tls_cert_days_remaining\{service="accounts-db"\}
  - tool: query_logs
    args:
      query: '{service="accounts", level="error"}'
    pattern: certificate has expired
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: accounts-db
  - kind: restart_service
    target: accounts
  - kind: scale_service
    target: accounts
  - kind: rollback_deploy
    target: orders
  - kind: rollback_deploy
    target: frontend
  red_herrings:
  - 'accounts'' pool shrinks: connections close and none can be opened, so it is not full'
  - orders v7.8.0 shipped 118 minutes before the alert, and none of its metrics moved after it
  - search logs 'email template promo-weekly has no translation for locale pt-BR' errors all window long,
    before and after
  - frontend v2.6.0 shipped 3 minutes before the alert, and none of its metrics moved after it
