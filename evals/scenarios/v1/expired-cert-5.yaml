id: expired-cert-5
title: accounts-db's certificate expires
seed: 92837
alert:
  labels:
    alertname: AccountsHighErrorRate
    service: accounts
    severity: critical
  annotations:
    summary: accounts 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="accounts"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: accounts
    op: '>'
    threshold: 0.05
    for: 2m
services:
  frontend:
    depends_on:
    - accounts
  accounts:
    depends_on:
    - accounts-db
    - coredns
  accounts-db: {}
  orders: {}
  search: {}
  coredns: {}
  nightly-backup: {}
