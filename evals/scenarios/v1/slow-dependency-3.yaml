id: slow-dependency-3
title: feature-store slows recommendations
seed: 18518
alert:
  labels:
    alertname: RecommendationsHighLatency
    service: recommendations
    severity: warning
  annotations:
    summary: recommendations p99 latency above 1 s for 3 minutes
    description: http_latency_p99_seconds{service="recommendations"} > 1 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: recommendations
    op: '>'
    threshold: 1.0
    for: 3m
services:
  frontend:
    depends_on:
    - recommendations
    - catalog
  recommendations:
    depends_on:
    - feature-store
    - catalog
    - coredns
  feature-store: {}
  catalog: {}
  cart: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: cart
  version: v7.15.0
  previous_version: v7.14.6
  at: -119m
  author: dev.kim
  change: Bump dependencies
- service: catalog
  version: v2.14.0
  previous_version: v2.13.6
  at: -6m
  author: maria.g
  change: Tune log sampling
background_deploys_days: 7
