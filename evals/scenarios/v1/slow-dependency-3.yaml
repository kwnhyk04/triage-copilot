labels:
  root_cause_class: dependency_failure
  service: feature-store
  alternatives: []
  onset: -330s
  required_signals:
  - tool: query_metrics
    args:
      query: upstream_latency_p99_seconds{peer="feature-store", service="recommendations"}
    pattern: upstream_latency_p99_seconds\{peer="feature-store", service="recommendations"\}
  - tool: query_metrics
    args:
      query: http_latency_p99_seconds{service="feature-store"}
    pattern: http_latency_p99_seconds\{service="feature-store"\}
  - tool: query_logs
    args:
      query: '{service="recommendations", level="warn"}'
    pattern: feature-store GetOnlineFeatures
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: recommendations
  - kind: scale_service
    target: recommendations
  - kind: rollback_deploy
    target: cart
  - kind: rollback_deploy
    target: catalog
  red_herrings:
  - cart v7.15.0 shipped 119 minutes before the alert, and none of its metrics moved after it
  - frontend logs 'session store' errors all window long, before and after
  - catalog v2.14.0 shipped 6 minutes before the alert, and none of its metrics moved after it
