id: bad-config-2
title: search's backend timeout becomes 20 ms
seed: 90444
alert:
  labels:
    alertname: SearchHighErrorRate
    service: search
    severity: critical
  annotations:
    summary: search 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="search"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: search
    op: '>'
    threshold: 0.05
    for: 2m
services:
  web:
    depends_on:
    - search
  search:
    depends_on:
    - search-index
    - catalog
    - coredns
  search-index: {}
  catalog: {}
  accounts: {}
  coredns: {}
  nightly-backup: {}
