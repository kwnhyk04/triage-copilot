- labels:
    service: search
    level: info
  per_minute: 1
  from: -2m
  to: -1m
  lines:
  - 'config reloaded from config-service: search.highlight.max_fragments=5 (was 3), changed by ops-bot'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-7
labels:
  root_cause_class: config_change
  service: search
  alternatives: []
  onset: -330s
  required_signals:
  - tool: query_logs
    args:
      query: '{service="search", level="info"} |= "config reloaded"'
    pattern: timeout_ms=20
  - tool: query_logs
    args:
      query: '{service="search", level="error"}'
    pattern: timed out after 20ms
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: search-index
  - kind: scale_service
    target: search-index
  - kind: rollback_deploy
    target: accounts
  red_herrings:
  - 'search-index''s own latency and CPU stay normal: it answers, search gives up too soon'
  - accounts v4.16.0 shipped 127 minutes before the alert, and none of its metrics moved after it
  - web logs 'analytics beacon rejected' errors all window long, before and after
  - search's config key search.highlight.max_fragments changed 2 minutes before the alert, after its errors
    had begun
