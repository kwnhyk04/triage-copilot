labels:
  root_cause_class: dependency_failure
  service: geo-api
  alternatives: []
  onset: -330s
  required_signals:
  - tool: query_metrics
    args:
      query: upstream_error_ratio{peer="geo-api", service="accounts"}
    pattern: upstream_error_ratio\{peer="geo-api", service="accounts"\}
  - tool: query_logs
    args:
      query: '{service="accounts", level="error"}'
    pattern: geo-api returned 503
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: accounts-db
  - kind: rollback_deploy
    target: accounts
  - kind: rollback_deploy
    target: search
  - kind: disable_feature_flag
    target: frontend
    parameters:
      flag: new-header-nav
  red_herrings:
  - search v3.15.0 shipped 122 minutes before the alert, and none of its metrics moved after it
  - frontend logs 'analytics beacon rejected' errors all window long, before and after
  - frontend's flag new-header-nav changed 5 minutes before the alert, and none of its metrics moved after
    it
