    service: frontend
    level: info
  per_minute: 14
  lines:
  - GET / 200 {ms}ms request_id={rid}
  - GET /product/{n} 200 {ms}ms request_id={rid}
  - GET /cart 200 {ms}ms request_id={rid}
- labels:
    service: checkout
    level: info
  per_minute: 12
  lines:
  - POST /checkout 200 {ms}ms request_id={rid}
  - GET /cart/total 200 {ms}ms request_id={rid}
- labels:
    service: pricing
    level: info
  per_minute: 12
  lines:
  - POST /quote 200 {ms}ms request_id={rid}
  - GET /prices/{n} 200 {ms}ms request_id={rid}
- labels:
    service: cart
    level: info
  per_minute: 9
  lines:
  - GET /cart/{n} 200 {ms}ms request_id={rid}
  - POST /cart/{n}/items 200 {ms}ms request_id={rid}
- labels:
    service: catalog
    level: info
  per_minute: 13
  lines:
  - GET /products/{n} 200 {ms}ms request_id={rid}
  - GET /categories 200 {ms}ms request_id={rid}
- labels:
    service: payments
    level: info
  per_minute: 9
  lines:
  - POST /charge 200 {ms}ms request_id={rid}
  - POST /refund 200 {ms}ms request_id={rid}
- labels:
    service: pricing
    level: info
  per_minute: 1
  from: -35m
  to: -34m
  lines:
  - 'Rolling update: canary pod pricing-{rid} started version=v1.12.0, 1 of 8 pods'
- labels:
    service: pricing
    level: info
  per_minute: 1
  from: -6m
  to: -5m
  lines:
  - canary analysis passed, promoting version=v1.12.0 to all pods
- labels:
    service: pricing
    level: info
  per_minute: 2
  from: -6m
  to: -4m
  lines:
  - 'Rolling update: pod pricing-{rid} started version=v1.12.0'
- labels:
    service: cart
    level: info
  per_minute: 2
  from: -25m
  to: -24m
  lines:
  - 'Rolling update: pod cart-{rid} started version=v4.2.1'
- labels:
    service: checkout
    level: error
  per_minute: 5
  from: -35m
  to: -4m
  lines:
  - 'InvalidResponseException: pricing returned total "{n}.50" where a number was expected request_id={rid}'
  - POST /checkout 500 {ms}ms request_id={rid}
- labels:
    service: checkout
    level: error
  per_minute: 45
  from: -4m
  lines:
  - 'InvalidResponseException: pricing returned total "{n}.50" where a number was expected request_id={rid}'
  - POST /checkout 500 {ms}ms request_id={rid}
- labels:
    service: catalog
    level: info
  per_minute: 2
  from: -115m
  to: -114m
  lines:
  - 'Rolling update: pod catalog-{rid} started version=v6.15.0'
- labels:
    service: catalog
    level: error
  per_minute: 32
  lines:
  - 'failed to export spans: exporter queue full, dropped {n} spans'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-7
labels:
  root_cause_class: bad_deploy
  service: pricing
  alternatives: []
  onset: -35m
  required_signals:
  - tool: list_deploys
    args:
      service: pricing
    pattern: pricing v1\.11\.3 -> v1\.12\.0
  - tool: query_logs
    args:
      query: '{service="checkout", level="error"}'
    pattern: pricing returned total
  acceptable_actions:
  - kind: rollback_deploy
    target: pricing
    parameters:
      to_version: v1.11.3
  forbidden_actions:
  - kind: rollback_deploy
    target: checkout
  - kind: rollback_deploy
    target: cart
  - kind: rollback_deploy
    target: catalog
  red_herrings:
  - cart v4.2.1 shipped 25 minutes before the alert and its error ratio never moved
  - 'pricing''s own error ratio stays flat: it answers 200 with a total checkout cannot read'
  - catalog v6.15.0 shipped 115 minutes before the alert, and none of its metrics moved after it
  - catalog logs 'failed to export spans' errors all window long, before and after
