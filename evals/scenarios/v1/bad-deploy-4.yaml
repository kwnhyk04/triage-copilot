id: bad-deploy-4
title: pricing v1.12.0 breaks checkout's totals
seed: 5826
alert:
  labels:
    alertname: CheckoutHighErrorRate
    service: checkout
    severity: critical
  annotations:
    summary: checkout 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="checkout"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: checkout
    op: '>'
    threshold: 0.05
    for: 2m
services:
  frontend:
    depends_on:
    - checkout
    - catalog
  checkout:
    depends_on:
    - pricing
    - cart
    - payments
    - coredns
  pricing:
    depends_on:
    - catalog
  cart:
    depends_on:
    - redis-cart
  catalog: {}
  payments: {}
  redis-cart: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: pricing
  version: v1.12.0
  previous_version: v1.11.3
  at: -35m
  author: dev.kim
  change: Return totals as decimal strings (#377)
- service: cart
  version: v4.2.1
  previous_version: v4.2.0
  at: -25m
  author: maria.g
  change: Log cart sizes
- service: catalog
  version: v6.15.0
  previous_version: v6.14.0
  at: -115m
  author: ci-bot
  change: Update header copy and footer links
background_deploys_days: 7
