  - container recommendations-{rid} OOMKilled (exit code 137), memory limit 3Gi; restarting
- labels:
    service: cart
    level: info
  per_minute: 2
  from: -119m
  to: -118m
  lines:
  - 'Rolling update: pod cart-{rid} started version=v2.7.0'
- labels:
    service: frontend
    level: error
  per_minute: 29
  lines:
  - 'analytics beacon rejected: 413 Payload Too Large (batch={n})'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-9
down: logs
labels:
  root_cause_class: resource_exhaustion
  service: recommendations
  alternatives: []
  onset: -5h
  required_signals:
  - tool: query_metrics
    args:
      query: memory_usage_ratio{service="recommendations"}
    pattern: memory_usage_ratio\{service="recommendations"\}
  - tool: query_metrics
    args:
      query: container_restarts_total{service="recommendations"}
    pattern: container_restarts_total\{service="recommendations"\}
  acceptable_actions:
  - kind: restart_service
    target: recommendations
  - kind: scale_service
    target: recommendations
  forbidden_actions:
  - kind: rollback_deploy
    target: cart
  red_herrings:
  - cart v2.7.0 shipped 119 minutes before the alert, and none of its metrics moved after it
  - frontend logs 'analytics beacon rejected' errors all window long, before and after
