logs:
- labels:
    service: frontend
    level: info
  per_minute: 9
  lines:
  - GET / 200 {ms}ms request_id={rid}
  - GET /product/{n} 200 {ms}ms request_id={rid}
  - GET /cart 200 {ms}ms request_id={rid}
- labels:
    service: recommendations
    level: info
  per_minute: 14
  lines:
  - GET /recommendations/{n} 200 {ms}ms request_id={rid}
  - GET /recommendations/trending 200 {ms}ms request_id={rid}
- labels:
