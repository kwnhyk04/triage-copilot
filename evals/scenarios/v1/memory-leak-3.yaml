id: memory-leak-3
title: recommendations leaks model tensors
seed: 75042
alert:
  labels:
    alertname: RecommendationsHighErrorRate
    service: recommendations
    severity: critical
  annotations:
    summary: recommendations 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="recommendations"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: recommendations
    op: '>'
    threshold: 0.05
    for: 2m
services:
  frontend:
    depends_on:
    - recommendations
    - catalog
  recommendations:
    depends_on:
    - feature-store
    - coredns
  feature-store: {}
  catalog: {}
  cart: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: cart
  version: v2.7.0
  previous_version: v2.6.4
  at: -119m
  author: li.wei
  change: Tune log sampling
background_deploys_days: 7
