id: bad-config-3
title: dynamic-discounts saturates pricing
seed: 97274
alert:
  labels:
    alertname: PricingHighLatency
    service: pricing
    severity: warning
  annotations:
    summary: pricing p99 latency above 1 s for 3 minutes
    description: http_latency_p99_seconds{service="pricing"} > 1 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: pricing
    op: '>'
    threshold: 1.0
    for: 3m
services:
  checkout:
    depends_on:
    - pricing
  cart:
    depends_on:
    - pricing
  pricing:
    depends_on:
    - catalog
    - coredns
  catalog: {}
  orders: {}
  coredns: {}
  nightly-backup: {}
