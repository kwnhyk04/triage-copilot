- labels:
    service: pricing
    level: info
  per_minute: 6
  from: -20m
  lines:
  - 'quote computed with dynamic-discounts: {n} rules evaluated in {ms}ms request_id={rid}'
- labels:
    service: pricing
    level: warn
  per_minute: 20
  from: -5m
  lines:
  - 'slow quote: dynamic-discounts evaluated 1840 rules in 2390ms request_id={rid}'
  - 'slow quote: dynamic-discounts evaluated 2215 rules in 2875ms request_id={rid}'
- labels:
    service: orders
    level: info
  per_minute: 2
  from: -124m
  to: -123m
  lines:
  - 'Rolling update: pod orders-{rid} started version=v4.4.0'
- labels:
    service: catalog
    level: error
  per_minute: 35
  lines:
  - 'thumbnail generation failed for sku={n}: unsupported color profile'
- labels:
    service: pricing
    level: info
  per_minute: 1
  from: -3m
  to: -2m
  lines:
  - 'feature flag price-display-rounding changed: off -> on (by ana.lopez)'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-1
labels:
  root_cause_class: config_change
  service: pricing
  alternatives: []
  onset: -20m
  required_signals:
  - tool: query_logs
    args:
      query: '{service="pricing", level="info"} |= "feature flag"'
    pattern: dynamic-discounts
  - tool: query_logs
    args:
      query: '{service="pricing", level="warn"}'
    pattern: dynamic-discounts evaluated
  acceptable_actions:
  - kind: disable_feature_flag
    target: pricing
    parameters:
      flag: dynamic-discounts
  - kind: scale_service
    target: pricing
  forbidden_actions:
  - kind: rollback_deploy
    target: catalog
  - kind: rollback_deploy
    target: orders
  - kind: disable_feature_flag
    target: pricing
    parameters:
      flag: price-display-rounding
  red_herrings:
  - pricing's CPU saturates, but only because of the work the flag turned on
  - orders v4.4.0 shipped 124 minutes before the alert, and none of its metrics moved after it
  - catalog logs 'thumbnail generation failed for sku=' errors all window long, before and after
  - pricing's flag price-display-rounding changed 3 minutes before the alert, after its latency had already
    risen
