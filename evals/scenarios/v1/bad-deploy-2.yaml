- labels:
    service: search
    level: info
  per_minute: 2
  from: -5m
  to: -3m
  lines:
  - 'Rolling update: pod search-{rid} started version=v5.2.0, replacing v5.1.4'
- labels:
    service: search
    level: error
  per_minute: 5
  from: -20m
  to: -4m
  lines:
  - 'QueryParseException: unexpected token ''&'' at position {n} version=v5.2.0 request_id={rid}'
  - GET /search 500 {ms}ms version=v5.2.0 request_id={rid}
- labels:
    service: search
    level: error
  per_minute: 40
  from: -4m
  lines:
  - 'QueryParseException: unexpected token ''&'' at position {n} version=v5.2.0 request_id={rid}'
  - GET /search 500 {ms}ms version=v5.2.0 request_id={rid}
- labels:
    service: web
    level: error
  per_minute: 12
  from: -4m
  lines:
