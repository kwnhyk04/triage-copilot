id: bad-deploy-2
title: search v5.2.0 rejects queries with '&'
seed: 10135
alert:
  labels:
    alertname: SearchHighErrorRate
    service: search
    severity: critical
  annotations:
    summary: search 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="search"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: search
    op: '>'
    threshold: 0.05
    for: 2m
services:
  web:
    depends_on:
    - search
    - catalog
  search:
    depends_on:
    - search-index
    - catalog
    - coredns
  search-index: {}
  catalog: {}
  accounts: {}
  notifications: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: search
  version: v5.2.0
  previous_version: v5.1.4
  at: -20m
  author: dev.kim
  change: Switch query parsing to the new tokenizer (#2231)
- service: notifications
  version: v2.16.0
  previous_version: v2.15.7
  at: -118m
  author: sam.okafor
  change: Translate the settings page
background_deploys_days: 7
