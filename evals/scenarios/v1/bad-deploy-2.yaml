- labels:
    service: search
    level: info
  per_minute: 1
  from: -2m
  to: -1m
  lines:
  - 'feature flag search-result-thumbnails changed: rollout 50% -> 100% (by dev.kim)'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-2
down: deploys
labels:
  root_cause_class: bad_deploy
  service: search
  alternatives: []
  onset: -20m
  required_signals:
  - tool: query_logs
    args:
      query: '{service="search", level="error"}'
    pattern: QueryParseException
  - tool: query_logs
    args:
      query: '{service="search"} |= "Rolling update"'
    pattern: started version=v5\.2\.0, replacing v5\.1\.4
  acceptable_actions:
  - kind: rollback_deploy
    target: search
    parameters:
      to_version: v5.1.4
  forbidden_actions:
  - kind: restart_service
    target: search-index
  - kind: rollback_deploy
    target: notifications
  - kind: disable_feature_flag
    target: search
    parameters:
      flag: search-result-thumbnails
  red_herrings:
  - notifications v2.16.0 shipped 118 minutes before the alert, and none of its metrics moved after it
  - accounts logs 'email template promo-weekly has no translation for locale pt-BR' errors all window
    long, before and after
  - search's flag search-result-thumbnails changed 2 minutes before the alert, after its errors had begun
