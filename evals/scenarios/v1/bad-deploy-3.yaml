id: bad-deploy-3
title: payments v3.0.0 serializes charges
seed: 21857
alert:
  labels:
    alertname: PaymentsHighLatency
    service: payments
    severity: warning
  annotations:
    summary: payments p99 latency above 1 s for 3 minutes
    description: http_latency_p99_seconds{service="payments"} > 1 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: payments
    op: '>'
    threshold: 1.0
    for: 3m
services:
  frontend:
    depends_on:
    - checkout
  checkout:
    depends_on:
    - payments
    - cart
  payments:
    depends_on:
    - card-network
    - payments-db
    - coredns
  card-network: {}
  payments-db: {}
  cart: {}
  accounts: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: payments
  version: v3.0.0
  previous_version: v2.9.7
  at: -8m
  author: dev.kim
  change: Idempotency cache with a global lock (#918)
- service: accounts
  version: v7.10.0
  previous_version: v7.9.9
  at: -125m
  author: dev.kim
  change: Bump dependencies
background_deploys_days: 7
