- labels:
    service: payments
    level: info
  per_minute: 2
  from: -8m
  to: -5m
  lines:
  - 'Rolling update: pod payments-{rid} started version=v3.0.0'
- labels:
    service: payments
    level: warn
  per_minute: 30
  from: -5m
  lines:
  - 'slow request: POST /charge took 2412ms, 2280ms waiting for the idempotency lock version=v3.0.0'
  - 'slow request: POST /charge took 3005ms, 2871ms waiting for the idempotency lock version=v3.0.0'
- labels:
    service: accounts
    level: info
  per_minute: 2
  from: -125m
  to: -124m
  lines:
