- labels:
    service: payments
    level: info
  per_minute: 1
  from: -3m
  to: -2m
  lines:
  - 'feature flag payments-receipt-email changed: off -> on (by sam.okafor)'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-8
labels:
  root_cause_class: bad_deploy
  service: payments
  alternatives: []
  onset: -8m
  required_signals:
  - tool: list_deploys
    args:
      service: payments
    pattern: payments v2\.9\.7 -> v3\.0\.0
  - tool: query_logs
    args:
      query: '{service="payments", level="warn"}'
    pattern: waiting for the idempotency lock
  acceptable_actions:
  - kind: rollback_deploy
    target: payments
    parameters:
      to_version: v2.9.7
  forbidden_actions:
  - kind: scale_service
    target: payments-db
  - kind: rollback_deploy
    target: accounts
  - kind: disable_feature_flag
    target: payments
    parameters:
      flag: payments-receipt-email
  red_herrings:
  - card-network's latency as payments sees it stays flat, so the provider is not slow
  - accounts v7.10.0 shipped 125 minutes before the alert, and none of its metrics moved after it
  - frontend logs 'session store' errors all window long, before and after
  - payments's flag payments-receipt-email changed 3 minutes before the alert, after its latency had already
    risen
