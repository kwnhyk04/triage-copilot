id: bad-config-4
title: a route sends cart traffic to cart-legacy
seed: 11897
alert:
  labels:
    alertname: ApiGatewayHighErrorRate
    service: api-gateway
    severity: critical
  annotations:
    summary: api-gateway 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="api-gateway"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: api-gateway
    op: '>'
    threshold: 0.05
    for: 2m
services:
  api-gateway:
    depends_on:
    - cart
    - cart-legacy
    - checkout
    - coredns
  checkout:
    depends_on:
    - cart
  cart: {}
  cart-legacy: {}
  catalog: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: catalog
  version: v6.11.0
  previous_version: v6.10.8
  at: -123m
  author: ana.lopez
  change: Bump dependencies
- service: cart
  version: v7.10.0
  previous_version: v7.9.7
  at: -2m
  author: li.wei
  change: Update header copy and footer links
background_deploys_days: 7
