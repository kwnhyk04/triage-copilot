logs:
- labels:
    service: api-gateway
    level: info
  per_minute: 8
  lines:
  - GET /api/cart/{n} 200 {ms}ms request_id={rid}
  - POST /api/checkout 200 {ms}ms request_id={rid}
  - GET /api/products/{n} 200 {ms}ms request_id={rid}
- labels:
    service: cart
    level: info
  per_minute: 8
  lines:
  - GET /cart/{n} 200 {ms}ms request_id={rid}
  - POST /cart/{n}/items 200 {ms}ms request_id={rid}
- labels:
    service: checkout
    level: info
  per_minute: 9
  lines:
  - POST /checkout 200 {ms}ms request_id={rid}
  - GET /cart/total 200 {ms}ms request_id={rid}
- labels:
    service: catalog
    level: info
  per_minute: 11
  lines:
  - GET /products/{n} 200 {ms}ms request_id={rid}
  - GET /categories 200 {ms}ms request_id={rid}
- labels:
    service: api-gateway
    level: info
  per_minute: 1
  from: -330s
  to: -270s
  lines:
  - 'routes reloaded by config-sync: /api/cart/* -> cart (80%), cart-legacy (20%)'
- labels:
    service: api-gateway
    level: error
  per_minute: 40
  from: -4m
  lines:
  - 'upstream cart-legacy: no healthy upstream (GET /api/cart/{n}), 503 request_id={rid}'
- labels:
    service: catalog
    level: info
  per_minute: 2
  from: -123m
  to: -122m
  lines:
  - 'Rolling update: pod catalog-{rid} started version=v6.11.0'
- labels:
    service: checkout
    level: error
  per_minute: 27
  lines:
  - deprecated endpoint /v1/legacy-search called by client mobile-ios/4.{n}
- labels:
    service: cart
    level: info
  per_minute: 2
  from: -2m
  to: -1m
  lines:
  - 'Rolling update: pod cart-{rid} started version=v7.10.0'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-1
labels:
  root_cause_class: config_change
  service: api-gateway
  alternatives: []
  onset: -330s
  required_signals:
  - tool: query_logs
    args:
      query: '{service="api-gateway", level="info"} |= "routes reloaded"'
    pattern: cart-legacy
  - tool: query_logs
    args:
      query: '{service="api-gateway", level="error"}'
    pattern: upstream cart-legacy
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: cart
  - kind: rollback_deploy
    target: cart
  - kind: rollback_deploy
    target: catalog
  red_herrings:
  - 'cart itself is healthy: the 503s come from requests routed to cart-legacy'
  - catalog v6.11.0 shipped 123 minutes before the alert, and none of its metrics moved after it
  - checkout logs 'deprecated endpoint /v1/legacy-search called by client mobile-ios/4.' errors all window
    long, before and after
  - cart v7.10.0 shipped 2 minutes before the alert, and none of its metrics moved after it
