logs:
- labels:
    service: checkout
    level: info
  per_minute: 13
  lines:
  - POST /checkout 200 {ms}ms request_id={rid}
  - GET /cart/total 200 {ms}ms request_id={rid}
- labels:
    service: orders
    level: info
  per_minute: 10
  lines:
  - POST /orders 200 {ms}ms request_id={rid}
  - GET /orders/{n} 200 {ms}ms request_id={rid}
- labels:
    service: inventory
    level: info
  per_minute: 14
  lines:
  - GET /stock/{n} 200 {ms}ms request_id={rid}
  - POST /reservations 200 {ms}ms request_id={rid}
- labels:
    service: accounts
    level: info
  per_minute: 12
  lines:
  - POST /login 200 {ms}ms request_id={rid}
  - GET /me 200 {ms}ms request_id={rid}
  - POST /addresses 200 {ms}ms request_id={rid}
- labels:
    service: orders-db
    level: info
  per_minute: 3
  lines:
  - 'checkpoint complete: wrote {n} buffers'
- labels:
    service: inventory-db
    level: info
  per_minute: 3
  lines:
  - 'checkpoint complete: wrote {n} buffers'
- labels:
    service: orders
    level: error
  per_minute: 36
  from: -4m
  lines:
  - 'reserve stock: rpc error: code = Unavailable desc = tls: failed to verify certificate for inventory.internal:
    x509: certificate has expired'
- labels:
    service: accounts
    level: info
  per_minute: 2
  from: -2h
  to: -119m
  lines:
  - 'Rolling update: pod accounts-{rid} started version=v2.14.0'
- labels:
    service: checkout
    level: error
  per_minute: 33
  lines:
  - email template promo-weekly has no translation for locale pt-BR
- labels:
    service: orders
    level: info
  per_minute: 1
  from: -2m
  to: -1m
  lines:
  - 'config reloaded from config-service: orders.invoice_template=v7 (was v6), changed by ops-bot'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-8
labels:
  root_cause_class: certificate_expiry
  service: inventory
  alternatives: []
  onset: -4m
  required_signals:
  - tool: query_metrics
    args:
      query: tls_handshake_errors_per_second{peer="inventory", service="orders"}
    pattern: tls_handshake_errors_per_second\{peer="inventory", service="orders"\}
  - tool: query_logs
    args:
      query: '{service="orders", level="error"}'
    pattern: certificate has expired
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: inventory-db
  - kind: rollback_deploy
    target: orders
  - kind: rollback_deploy
    target: accounts
  red_herrings:
  - accounts v2.14.0 shipped 120 minutes before the alert, and none of its metrics moved after it
  - checkout logs 'email template promo-weekly has no translation for locale pt-BR' errors all window
    long, before and after
  - orders's config key orders.invoice_template changed 2 minutes before the alert, after its errors had
    begun
