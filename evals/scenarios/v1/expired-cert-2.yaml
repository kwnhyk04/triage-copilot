id: expired-cert-2
title: inventory's mesh certificate expires
seed: 17318
alert:
  labels:
    alertname: OrdersHighErrorRate
    service: orders
    severity: critical
  annotations:
    summary: orders 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="orders"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: orders
    op: '>'
    threshold: 0.05
    for: 2m
services:
  checkout:
    depends_on:
    - orders
  orders:
    depends_on:
    - inventory
    - orders-db
    - coredns
  inventory:
    depends_on:
    - inventory-db
  orders-db: {}
  inventory-db: {}
  accounts: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: accounts
  version: v2.14.0
  previous_version: v2.13.3
  at: -2h
  author: renovate-bot
  change: Add a metrics label to the request histogram
background_deploys_days: 7
