id: dns-partition-5
title: nat-gateway runs out of ports
seed: 83026
alert:
  labels:
    alertname: AccountsHighErrorRate
    service: accounts
    severity: critical
  annotations:
    summary: accounts 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="accounts"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: accounts
    op: '>'
    threshold: 0.05
    for: 2m
services:
  frontend:
    depends_on:
    - accounts
    - checkout
  accounts:
    depends_on:
    - geo-api
    - nat-gateway
    - coredns
  checkout:
    depends_on:
    - tax-service
    - nat-gateway
  geo-api: {}
  tax-service: {}
  nat-gateway: {}
  catalog: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: catalog
  version: v2.9.0
  previous_version: v2.8.2
  at: -128m
  author: ci-bot
  change: Add a metrics label to the request histogram
- service: frontend
  version: v1.5.0
  previous_version: v1.4.8
  at: -4m
  author: sam.okafor
  change: Update header copy and footer links
