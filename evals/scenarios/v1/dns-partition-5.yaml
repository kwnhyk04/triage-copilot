labels:
  root_cause_class: infrastructure
  service: nat-gateway
  alternatives: []
  onset: -6m
  required_signals:
  - tool: query_metrics
    args:
      query: tcp_connect_errors_per_second{peer="tax-service", service="checkout"}
    pattern: tcp_connect_errors_per_second\{peer="tax-service", service="checkout"\}
  - tool: query_logs
    args:
      query: '{service="nat-gateway"}'
    pattern: SNAT port allocation failed
  acceptable_actions: []
  forbidden_actions:
  - kind: rollback_deploy
    target: accounts
  - kind: restart_service
    target: accounts
  - kind: rollback_deploy
    target: catalog
  - kind: rollback_deploy
    target: frontend
  red_herrings:
  - 'checkout''s calls to tax-service fail to connect too: the shared NAT gateway, not geo-api'
  - catalog v2.9.0 shipped 128 minutes before the alert, and none of its metrics moved after it
  - frontend logs 'failed to export spans' errors all window long, before and after
  - frontend v1.5.0 shipped 4 minutes before the alert, and none of its metrics moved after it
