id: noisy-neighbor-5
title: image-resizer starves catalog
seed: 71487
alert:
  labels:
    alertname: CatalogHighLatency
    service: catalog
    severity: warning
  annotations:
    summary: catalog p99 latency above 1 s for 3 minutes
    description: http_latency_p99_seconds{service="catalog"} > 1 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: catalog
    op: '>'
    threshold: 1.0
    for: 3m
services:
  frontend:
    depends_on:
    - catalog
  search:
    depends_on:
    - catalog
  catalog:
    depends_on:
    - catalog-db
    - coredns
  catalog-db: {}
  image-resizer: {}
  cart: {}
  coredns: {}
deploys:
- service: cart
  version: v6.14.0
  previous_version: v6.13.3
  at: -126m
  author: sam.okafor
  change: Tune log sampling
background_deploys_days: 7
