  per_minute: 1
  from: -6m
  to: -5m
  lines:
  - 'feature flag search-suggest-v2 changed: rollout 25% -> 50% (by dev.kim)'
labels:
  root_cause_class: infrastructure
  service: image-resizer
  alternatives: []
  onset: -13m
  required_signals:
  - tool: query_metrics
    args:
      query: cpu_usage_ratio{node="node-4", service="image-resizer"}
    pattern: cpu_usage_ratio\{node="node-4", service="image-resizer"\}
  - tool: query_logs
    args:
      query: '{service="image-resizer"}'
    pattern: on node-4
  acceptable_actions:
  - kind: scale_service
    target: catalog
  - kind: scale_service
    target: image-resizer
    parameters:
      replicas: '0'
  forbidden_actions:
  - kind: restart_service
    target: catalog-db
  - kind: rollback_deploy
    target: catalog
  - kind: rollback_deploy
    target: cart
  - kind: disable_feature_flag
    target: search
    parameters:
      flag: search-suggest-v2
  red_herrings:
  - cart v6.14.0 shipped 126 minutes before the alert, and none of its metrics moved after it
  - search logs 'failed to export spans' errors all window long, before and after
  - search's flag search-suggest-v2 changed 6 minutes before the alert, and none of its metrics moved
    after it
