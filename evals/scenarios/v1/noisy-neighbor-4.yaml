labels:
  root_cause_class: infrastructure
  service: report-builder
  alternatives: []
  onset: -14m
  required_signals:
  - tool: query_metrics
    args:
      query: cpu_usage_ratio{node="node-2", service="report-builder"}
    pattern: cpu_usage_ratio\{node="node-2", service="report-builder"\}
  - tool: query_logs
    args:
      query: '{service="report-builder"}'
    pattern: on node-2
  acceptable_actions:
  - kind: scale_service
    target: payments
  - kind: scale_service
    target: report-builder
    parameters:
      replicas: '0'
  forbidden_actions:
  - kind: restart_service
    target: payments-db
  - kind: rollback_deploy
    target: payments
  - kind: rollback_deploy
    target: accounts
  red_herrings:
  - card-network's latency as payments sees it stays flat
  - accounts v5.12.0 shipped 120 minutes before the alert, and none of its metrics moved after it
  - checkout logs 'deprecated endpoint /v1/legacy-search called by client mobile-ios/4.' errors all window
    long, before and after
