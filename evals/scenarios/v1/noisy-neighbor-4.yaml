id: noisy-neighbor-4
title: report-builder starves payments
seed: 55721
alert:
  labels:
    alertname: PaymentsHighLatency
    service: payments
    severity: warning
  annotations:
    summary: payments p99 latency above 1.5 s for 3 minutes
    description: http_latency_p99_seconds{service="payments"} > 1.5 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: payments
    op: '>'
    threshold: 1.5
    for: 3m
services:
  checkout:
    depends_on:
    - payments
  payments:
    depends_on:
    - card-network
    - payments-db
    - coredns
  card-network: {}
  payments-db: {}
  report-builder: {}
  accounts: {}
  coredns: {}
deploys:
- service: accounts
  version: v5.12.0
  previous_version: v5.11.0
  at: -2h
  author: li.wei
  change: Update header copy and footer links
