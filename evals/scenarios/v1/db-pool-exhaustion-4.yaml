id: db-pool-exhaustion-4
title: a cleanup job locks accounts-db
seed: 73320
alert:
  labels:
    alertname: AccountsHighErrorRate
    service: accounts
    severity: critical
  annotations:
    summary: accounts 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="accounts"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: accounts
    op: '>'
    threshold: 0.05
    for: 2m
services:
  frontend:
    depends_on:
    - accounts
  api-gateway:
    depends_on:
    - accounts
    - orders
  accounts:
    depends_on:
    - accounts-db
    - coredns
  accounts-db: {}
  orders: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: orders
  version: v4.20.0
  previous_version: v4.19.1
  at: -123m
  author: ci-bot
  change: Translate the settings page
