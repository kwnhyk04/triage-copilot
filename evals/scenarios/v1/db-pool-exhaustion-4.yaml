    level: info
  per_minute: 1
  from: -9m
  lines:
  - 'pid 2290 (job session-cleanup): DELETE FROM sessions WHERE expires_at < now() running'
- labels:
    service: accounts
    level: warn
  per_minute: 6
  from: -6m
  lines:
  - connection pool accounts-db at 25/25 connections, {n} requests waiting
  asserts:
  - metric: db_pool_in_use
    labels:
      service: accounts
    op: '>='
    value: 24
- labels:
    service: accounts
    level: error
  per_minute: 30
  from: -6m
  lines:
  - timeout acquiring connection from pool after 5000ms (pool=accounts-db, active=25, idle=0) request_id={rid}
  - 'request failed: PoolTimeoutException request_id={rid}'
  asserts:
  - metric: db_pool_in_use
    labels:
      service: accounts
    op: '>='
    value: 24
- labels:
    service: orders
    level: info
  per_minute: 2
  from: -123m
  to: -122m
  lines:
  - 'Rolling update: pod orders-{rid} started version=v4.20.0'
- labels:
    service: api-gateway
    level: error
  per_minute: 36
  lines:
  - 'failed to export spans: exporter queue full, dropped {n} spans'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-4
down: logs
labels:
  root_cause_class: database
  service: accounts-db
  alternatives: []
  onset: -9m
  required_signals:
  - tool: query_metrics
    args:
      query: db_lock_wait_seconds{service="accounts-db"}
    pattern: db_lock_wait_seconds\{service="accounts-db"\}
  - tool: query_metrics
    args:
      query: db_slow_queries_per_second{service="accounts-db"}
    pattern: db_slow_queries_per_second\{service="accounts-db"\}
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: accounts-db
  - kind: scale_service
    target: accounts
  - kind: rollback_deploy
    target: orders
  red_herrings:
  - orders v4.20.0 shipped 123 minutes before the alert, and none of its metrics moved after it
  - api-gateway logs 'failed to export spans' errors all window long, before and after
