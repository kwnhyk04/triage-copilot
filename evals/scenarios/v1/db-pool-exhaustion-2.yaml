id: db-pool-exhaustion-2
title: VACUUM FULL locks ledger_entries
seed: 40829
alert:
  labels:
    alertname: PaymentsHighErrorRate
    service: payments
    severity: critical
  annotations:
    summary: payments 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="payments"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: payments
    op: '>'
    threshold: 0.05
    for: 2m
services:
  checkout:
    depends_on:
    - payments
  payments:
    depends_on:
    - payments-db
    - card-network
    - coredns
  frontend:
    depends_on:
    - checkout
  payments-db: {}
  card-network: {}
  accounts: {}
  coredns: {}
  nightly-backup: {}
