logs:
- labels:
    service: frontend
    level: info
  per_minute: 11
  lines:
  - GET / 200 {ms}ms request_id={rid}
  - GET /product/{n} 200 {ms}ms request_id={rid}
  - GET /cart 200 {ms}ms request_id={rid}
- labels:
    service: checkout
    level: info
  per_minute: 9
  lines:
  - POST /checkout 200 {ms}ms request_id={rid}
  - GET /cart/total 200 {ms}ms request_id={rid}
- labels:
    service: payments
    level: info
  per_minute: 9
  lines:
  - POST /charge 200 {ms}ms request_id={rid}
  - POST /refund 200 {ms}ms request_id={rid}
- labels:
    service: accounts
    level: info
  per_minute: 10
  lines:
  - POST /login 200 {ms}ms request_id={rid}
  - GET /me 200 {ms}ms request_id={rid}
  - POST /addresses 200 {ms}ms request_id={rid}
- labels:
    service: payments-db
    level: info
  per_minute: 3
  lines:
  - 'checkpoint complete: wrote {n} buffers'
- labels:
    service: payments-db
    level: info
  per_minute: 1
  from: -8m
  to: -7m
  lines:
  - 'pid 7741 (user dba_ops, application psql): VACUUM FULL public.ledger_entries started'
- labels:
    service: payments-db
    level: warn
  per_minute: 12
  from: -8m
  lines:
  - process {n} still waiting for AccessShareLock on relation ledger_entries after 1000 ms; blocked by
    pid 7741
- labels:
    service: payments
    level: warn
  per_minute: 6
  from: -330s
  lines:
  - connection pool payments-db at 30/30 connections, {n} requests waiting
  asserts:
  - metric: db_pool_in_use
    labels:
      service: payments
    op: '>='
    value: 29
- labels:
    service: payments
    level: error
  per_minute: 30
  from: -330s
  lines:
  - timeout acquiring connection from pool after 5000ms (pool=payments-db, active=30, idle=0) request_id={rid}
  - 'request failed: PoolTimeoutException request_id={rid}'
  asserts:
  - metric: db_pool_in_use
    labels:
      service: payments
    op: '>='
    value: 29
- labels:
    service: accounts
    level: info
  per_minute: 2
  from: -125m
  to: -124m
  lines:
  - 'Rolling update: pod accounts-{rid} started version=v3.20.0'
- labels:
    service: frontend
    level: error
  per_minute: 29
  lines:
  - email template promo-weekly has no translation for locale pt-BR
- labels:
    service: checkout
    level: info
  per_minute: 1
  from: -2m
  to: -1m
  lines:
  - 'config reloaded from config-service: checkout.cart.max_items=100 (was 50), changed by ops-bot'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-7
labels:
  root_cause_class: database
  service: payments-db
  alternatives: []
  onset: -8m
  required_signals:
  - tool: query_logs
    args:
      query: '{service="payments-db"}'
    pattern: pid 7741
  - tool: query_metrics
    args:
      query: db_lock_wait_seconds{service="payments-db"}
    pattern: db_lock_wait_seconds\{service="payments-db"\}
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: payments-db
  - kind: scale_service
    target: payments
  - kind: rollback_deploy
    target: accounts
  red_herrings:
  - card-network, the provider payments calls, shows nothing unusual
  - accounts v3.20.0 shipped 125 minutes before the alert, and none of its metrics moved after it
  - frontend logs 'email template promo-weekly has no translation for locale pt-BR' errors all window
    long, before and after
  - checkout's config key checkout.cart.max_items changed 2 minutes before the alert, after its errors
    had begun
