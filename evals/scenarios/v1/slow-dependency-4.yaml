down: metrics
labels:
  root_cause_class: dependency_failure
  service: tax-service
  alternatives: []
  onset: -6m
  required_signals:
  - tool: query_logs
    args:
      query: '{service="checkout", level="warn"}'
    pattern: tax-service responded in
  acceptable_actions: []
  forbidden_actions:
  - kind: scale_service
    target: checkout
  - kind: rollback_deploy
    target: checkout
  - kind: rollback_deploy
    target: notifications
  red_herrings:
  - notifications v6.15.0 shipped 118 minutes before the alert, and none of its metrics moved after it
  - cart logs 'deprecated endpoint /v1/legacy-search called by client mobile-ios/4.' errors all window
    long, before and after
