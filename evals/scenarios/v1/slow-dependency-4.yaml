id: slow-dependency-4
title: tax-service slows checkout
seed: 30709
alert:
  labels:
    alertname: CheckoutHighLatency
    service: checkout
    severity: warning
  annotations:
    summary: checkout p99 latency above 2.5 s for 3 minutes
    description: http_latency_p99_seconds{service="checkout"} > 2.5 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: checkout
    op: '>'
    threshold: 2.5
    for: 3m
services:
  frontend:
    depends_on:
    - checkout
  checkout:
    depends_on:
    - tax-service
    - payments
    - cart
    - coredns
  tax-service: {}
  payments: {}
  cart: {}
  notifications: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: notifications
  version: v6.15.0
  previous_version: v6.14.1
  at: -118m
  author: ana.lopez
  change: Bump dependencies
background_deploys_days: 7
