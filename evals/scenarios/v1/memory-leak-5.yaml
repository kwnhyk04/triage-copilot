id: memory-leak-5
title: api-gateway keeps buffered bodies
seed: 49175
alert:
  labels:
    alertname: ApiGatewayHighErrorRate
    service: api-gateway
    severity: critical
  annotations:
    summary: api-gateway 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="api-gateway"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: api-gateway
    op: '>'
    threshold: 0.05
    for: 2m
