labels:
  root_cause_class: resource_exhaustion
  service: api-gateway
  alternatives: []
  onset: -210m
  required_signals:
  - tool: query_metrics
    args:
      query: memory_usage_ratio{service="api-gateway"}
    pattern: memory_usage_ratio\{service="api-gateway"\}
  - tool: query_metrics
    args:
      query: container_restarts_total{service="api-gateway"}
    pattern: container_restarts_total\{service="api-gateway"\}
  - tool: query_logs
    args:
      query: '{service="api-gateway", level="error"}'
    pattern: OOMKilled
  acceptable_actions:
  - kind: restart_service
    target: api-gateway
  - kind: scale_service
    target: api-gateway
  forbidden_actions:
  - kind: rollback_deploy
    target: cart
  - kind: rollback_deploy
    target: payments
  red_herrings:
  - payments v1.20.0 shipped 122 minutes before the alert, and none of its metrics moved after it
  - catalog logs 'deprecated endpoint /v1/legacy-search called by client mobile-ios/4.' errors all window
    long, before and after
