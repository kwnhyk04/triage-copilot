id: expired-cert-4
title: events-broker's certificate expires
seed: 35795
alert:
  labels:
    alertname: NotificationsHighErrorRate
    service: notifications
    severity: critical
  annotations:
    summary: notifications 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="notifications"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: notifications
    op: '>'
    threshold: 0.05
    for: 2m
services:
  orders:
    depends_on:
    - notifications
  notifications:
    depends_on:
    - events-broker
    - coredns
  events-broker: {}
  accounts: {}
  catalog: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: catalog
  version: v6.19.0
  previous_version: v6.18.4
  at: -127m
  author: ana.lopez
  change: Translate the settings page
- service: orders
  version: v7.12.0
  previous_version: v7.11.6
  at: -5m
  author: ana.lopez
  change: Translate the settings page
background_deploys_days: 7
