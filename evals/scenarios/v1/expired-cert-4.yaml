- labels:
    service: orders
    level: info
  per_minute: 2
  from: -5m
  to: -4m
  lines:
  - 'Rolling update: pod orders-{rid} started version=v7.12.0'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-2
labels:
  root_cause_class: certificate_expiry
  service: events-broker
  alternatives: []
  onset: -4m
  required_signals:
  - tool: query_metrics
    args:
      query: tls_cert_days_remaining{service="events-broker"}
    pattern: tls_cert_days_remaining\{service="events-broker"\}
  - tool: query_logs
    args:
      query: '{service="notifications", level="error"}'
    pattern: certificate has expired
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: events-broker
  - kind: scale_service
    target: notifications
  - kind: rollback_deploy
    target: catalog
  - kind: rollback_deploy
    target: orders
  red_herrings:
  - catalog v6.19.0 shipped 127 minutes before the alert, and none of its metrics moved after it
  - accounts logs 'failed to export spans' errors all window long, before and after
  - orders v7.12.0 shipped 5 minutes before the alert, and none of its metrics moved after it
