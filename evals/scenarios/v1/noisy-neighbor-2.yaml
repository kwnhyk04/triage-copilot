  - POST /cart/{n}/items 200 {ms}ms request_id={rid}
- labels:
    service: ml-trainer
    level: info
  per_minute: 2
  from: -15m
  lines:
  - 'epoch 3: training batch on node-3, 16 worker threads'
  - 'epoch 4: training batch on node-3, 16 worker threads'
- labels:
    service: cart
    level: info
  per_minute: 2
  from: -112m
  to: -111m
  lines:
