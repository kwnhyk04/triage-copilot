id: noisy-neighbor-2
title: ml-trainer starves checkout
seed: 25148
alert:
  labels:
    alertname: CheckoutHighLatency
    service: checkout
    severity: warning
  annotations:
    summary: checkout p99 latency above 1.5 s for 3 minutes
    description: http_latency_p99_seconds{service="checkout"} > 1.5 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: checkout
    op: '>'
    threshold: 1.5
    for: 3m
services:
  frontend:
    depends_on:
    - checkout
  checkout:
    depends_on:
    - payments
    - cart
    - coredns
  payments: {}
  cart: {}
  ml-trainer: {}
  coredns: {}
deploys:
- service: cart
  version: v6.5.0
  previous_version: v6.4.5
  at: -112m
  author: li.wei
  change: Bump dependencies
- service: payments
  version: v2.16.0
  previous_version: v2.15.6
  at: -3m
  author: renovate-bot
  change: Add a metrics label to the request histogram
background_deploys_days: 7
