    level: info
  per_minute: 2
  from: -3m
  to: -2m
  lines:
  - 'Rolling update: pod payments-{rid} started version=v2.16.0'
labels:
  root_cause_class: infrastructure
  service: ml-trainer
  alternatives: []
  onset: -15m
  required_signals:
  - tool: query_metrics
    args:
      query: cpu_usage_ratio{node="node-3", service="ml-trainer"}
    pattern: cpu_usage_ratio\{node="node-3", service="ml-trainer"\}
  - tool: query_logs
    args:
      query: '{service="ml-trainer"}'
    pattern: on node-3
  acceptable_actions:
  - kind: scale_service
    target: checkout
  - kind: scale_service
    target: ml-trainer
    parameters:
      replicas: '0'
  forbidden_actions:
  - kind: rollback_deploy
    target: checkout
  - kind: restart_service
    target: payments
  - kind: rollback_deploy
    target: cart
  - kind: rollback_deploy
    target: payments
  red_herrings:
  - cart v6.5.0 shipped 112 minutes before the alert, and none of its metrics moved after it
  - frontend logs 'analytics beacon rejected' errors all window long, before and after
  - payments v2.16.0 shipped 3 minutes before the alert, and none of its metrics moved after it
