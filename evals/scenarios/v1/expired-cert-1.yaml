logs:
- labels:
    service: frontend
    level: info
  per_minute: 12
  lines:
  - GET / 200 {ms}ms request_id={rid}
  - GET /product/{n} 200 {ms}ms request_id={rid}
  - GET /cart 200 {ms}ms request_id={rid}
- labels:
    service: checkout
    level: info
  per_minute: 10
  lines:
  - POST /checkout 200 {ms}ms request_id={rid}
  - GET /cart/total 200 {ms}ms request_id={rid}
- labels:
    service: payments
    level: info
  per_minute: 11
  lines:
  - POST /charge 200 {ms}ms request_id={rid}
  - POST /refund 200 {ms}ms request_id={rid}
- labels:
    service: cart
    level: info
  per_minute: 12
  lines:
  - GET /cart/{n} 200 {ms}ms request_id={rid}
  - POST /cart/{n}/items 200 {ms}ms request_id={rid}
- labels:
    service: catalog
    level: info
  per_minute: 10
  lines:
  - GET /products/{n} 200 {ms}ms request_id={rid}
  - GET /categories 200 {ms}ms request_id={rid}
- labels:
    service: checkout
    level: error
  per_minute: 45
  from: -4m
  lines:
  - 'POST https://payments.internal/charge: tls: failed to verify certificate: x509: certificate has expired
    or is not yet valid request_id={rid}'
- labels:
    service: catalog
    level: info
  per_minute: 2
  from: -121m
  to: -2h
  lines:
  - 'Rolling update: pod catalog-{rid} started version=v5.15.0'
- labels:
    service: cart
    level: error
  per_minute: 24
  lines:
  - deprecated endpoint /v1/legacy-search called by client mobile-ios/4.{n}
- labels:
    service: checkout
    level: info
  per_minute: 1
  from: -2m
  to: -1m
  lines:
  - 'feature flag checkout-upsell-banner changed: off -> on (by ana.lopez)'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-5
labels:
  root_cause_class: certificate_expiry
  service: payments
  alternatives: []
  onset: -4m
  required_signals:
  - tool: query_logs
    args:
      query: '{service="checkout", level="error"}'
    pattern: certificate has expired
  - tool: query_metrics
    args:
      query: tls_cert_days_remaining{service="payments"}
    pattern: tls_cert_days_remaining\{service="payments"\}
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: payments
  - kind: restart_service
    target: checkout
  - kind: rollback_deploy
    target: checkout
  - kind: rollback_deploy
    target: catalog
  - kind: disable_feature_flag
    target: checkout
    parameters:
      flag: checkout-upsell-banner
  red_herrings:
  - catalog v5.15.0 shipped 121 minutes before the alert, and none of its metrics moved after it
  - cart logs 'deprecated endpoint /v1/legacy-search called by client mobile-ios/4.' errors all window
    long, before and after
  - checkout's flag checkout-upsell-banner changed 2 minutes before the alert, after its errors had begun
