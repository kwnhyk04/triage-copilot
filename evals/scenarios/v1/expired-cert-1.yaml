id: expired-cert-1
title: payments' certificate expires
seed: 87804
alert:
  labels:
    alertname: CheckoutHighErrorRate
    service: checkout
    severity: critical
  annotations:
    summary: checkout 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="checkout"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: checkout
    op: '>'
    threshold: 0.05
    for: 2m
services:
  frontend:
    depends_on:
    - checkout
  checkout:
    depends_on:
    - payments
    - cart
    - coredns
  payments:
    depends_on:
    - card-network
  card-network: {}
  cart: {}
  catalog: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: catalog
  version: v5.15.0
  previous_version: v5.14.5
  at: -121m
  author: ci-bot
  change: Tune log sampling
background_deploys_days: 7
