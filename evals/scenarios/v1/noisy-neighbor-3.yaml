id: noisy-neighbor-3
title: log-compactor starves orders
seed: 37866
alert:
  labels:
    alertname: OrdersHighLatency
    service: orders
    severity: warning
  annotations:
    summary: orders p99 latency above 1.5 s for 3 minutes
    description: http_latency_p99_seconds{service="orders"} > 1.5 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: orders
    op: '>'
    threshold: 1.5
    for: 3m
services:
  checkout:
    depends_on:
    - orders
  orders:
    depends_on:
    - orders-db
    - coredns
  orders-db: {}
  log-compactor: {}
  notifications: {}
  coredns: {}
deploys:
- service: notifications
  version: v1.12.0
  previous_version: v1.11.0
  at: -122m
  author: ana.lopez
  change: Tune log sampling
- service: checkout
  version: v3.17.0
  previous_version: v3.16.1
  at: -4m
  author: ci-bot
  change: Update header copy and footer links
background_deploys_days: 7
