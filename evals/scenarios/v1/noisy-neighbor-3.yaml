labels:
  root_cause_class: infrastructure
  service: log-compactor
  alternatives: []
  onset: -10m
  required_signals:
  - tool: query_metrics
    args:
      query: cpu_usage_ratio{node="node-5", service="log-compactor"}
    pattern: cpu_usage_ratio\{node="node-5", service="log-compactor"\}
  - tool: query_logs
    args:
      query: '{service="log-compactor"}'
    pattern: on node-5
  acceptable_actions:
  - kind: scale_service
    target: orders
  - kind: scale_service
    target: log-compactor
    parameters:
      replicas: '0'
  forbidden_actions:
  - kind: restart_service
    target: orders-db
  - kind: rollback_deploy
    target: notifications
  - kind: rollback_deploy
    target: checkout
  red_herrings:
  - notifications v1.12.0 shipped 122 minutes before the alert, and none of its metrics moved after it
  - checkout logs 'failed to export spans' errors all window long, before and after
  - checkout v3.17.0 shipped 4 minutes before the alert, and none of its metrics moved after it
