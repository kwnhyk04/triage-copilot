labels:
  root_cause_class: resource_exhaustion
  service: search
  alternatives: []
  onset: -3h
  required_signals:
  - tool: query_metrics
    args:
      query: memory_usage_ratio{service="search"}
    pattern: memory_usage_ratio\{service="search"\}
  - tool: query_logs
    args:
      query: '{service="search", level="warn"}'
    pattern: GC overhead
  acceptable_actions:
  - kind: restart_service
    target: search
  - kind: scale_service
    target: search
  forbidden_actions:
  - kind: restart_service
    target: search-index
  - kind: rollback_deploy
    target: accounts
  - kind: disable_feature_flag
    target: web
    parameters:
      flag: web-dark-mode
  red_herrings:
  - accounts v4.14.0 shipped 114 minutes before the alert, and none of its metrics moved after it
  - catalog logs 'session store' errors all window long, before and after
  - web's flag web-dark-mode changed 3 minutes before the alert, and none of its metrics moved after it
