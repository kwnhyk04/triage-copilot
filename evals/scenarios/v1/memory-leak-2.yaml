id: memory-leak-2
title: search's result cache never evicts
seed: 95924
alert:
  labels:
    alertname: SearchHighLatency
    service: search
    severity: warning
  annotations:
    summary: search p99 latency above 1 s for 3 minutes
    description: http_latency_p99_seconds{service="search"} > 1 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: search
    op: '>'
    threshold: 1.0
    for: 3m
services:
