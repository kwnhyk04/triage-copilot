  - GET /prices/{n} 200 {ms}ms request_id={rid}
- labels:
    service: checkout
    level: info
  per_minute: 1
  from: -270s
  to: -210s
  lines:
  - 'feature flag new-tax-engine changed: rollout 5% -> 100% (by maria.g)'
- labels:
    service: checkout
    level: error
  per_minute: 40
  from: -4m
  lines:
  - 'TaxEngineV2Exception: no nexus configuration for state=WA request_id={rid}'
  - POST /checkout 500 {ms}ms request_id={rid}
- labels:
    service: pricing
    level: info
  per_minute: 2
  from: -123m
  to: -122m
  lines:
  - 'Rolling update: pod pricing-{rid} started version=v5.19.0'
- labels:
    service: frontend
    level: error
  per_minute: 31
  lines:
  - email template promo-weekly has no translation for locale pt-BR
- labels:
    service: payments
    level: info
  per_minute: 2
  from: -2m
  to: -1m
  lines:
  - 'Rolling update: pod payments-{rid} started version=v7.16.0'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-6
labels:
  root_cause_class: config_change
  service: checkout
  alternatives: []
  onset: -270s
  required_signals:
  - tool: query_logs
    args:
      query: '{service="checkout", level="info"} |= "feature flag"'
    pattern: new-tax-engine
  - tool: query_logs
    args:
      query: '{service="checkout", level="error"}'
    pattern: TaxEngineV2Exception
  acceptable_actions:
  - kind: disable_feature_flag
    target: checkout
    parameters:
      flag: new-tax-engine
  forbidden_actions:
  - kind: rollback_deploy
    target: payments
  - kind: rollback_deploy
    target: pricing
  red_herrings:
  - pricing v5.19.0 shipped 123 minutes before the alert, and none of its metrics moved after it
  - frontend logs 'email template promo-weekly has no translation for locale pt-BR' errors all window
    long, before and after
  - payments v7.16.0 shipped 2 minutes before the alert, and none of its metrics moved after it
