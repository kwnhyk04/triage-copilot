id: bad-config-1
title: new-tax-engine goes to 100%
seed: 99286
alert:
  labels:
    alertname: CheckoutHighErrorRate
    service: checkout
    severity: critical
  annotations:
    summary: checkout 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="checkout"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: checkout
    op: '>'
    threshold: 0.05
    for: 2m
services:
  frontend:
    depends_on:
    - checkout
  checkout:
    depends_on:
    - payments
    - cart
    - pricing
    - coredns
  payments: {}
  cart: {}
  pricing: {}
  coredns: {}
  nightly-backup: {}
