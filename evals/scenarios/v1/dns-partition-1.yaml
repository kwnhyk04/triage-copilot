id: dns-partition-1
title: coredns answers SERVFAIL
seed: 86059
alert:
  labels:
    alertname: PaymentsHighErrorRate
    service: payments
    severity: critical
  annotations:
    summary: payments 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="payments"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: payments
    op: '>'
    threshold: 0.05
    for: 2m
services:
  checkout:
    depends_on:
    - payments
  payments:
    depends_on:
    - card-network
    - coredns
  shipping:
    depends_on:
    - shipping-api
    - coredns
  card-network: {}
  shipping-api: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: checkout
  version: v4.9.0
  previous_version: v4.8.8
  at: -113m
  author: ci-bot
  change: Update header copy and footer links
- service: payments
  version: v6.16.0
  previous_version: v6.15.0
  at: -2m
  author: sam.okafor
  change: Bump dependencies
background_deploys_days: 7
