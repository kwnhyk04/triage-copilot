labels:
  root_cause_class: infrastructure
  service: coredns
  alternatives: []
  onset: -330s
  required_signals:
  - tool: query_metrics
    args:
      query: dns_servfail_ratio{service="coredns"}
    pattern: dns_servfail_ratio\{service="coredns"\}
  - tool: query_logs
    args:
      query: '{service="payments", level="error"}'
    pattern: server misbehaving
  acceptable_actions: []
  forbidden_actions:
  - kind: rollback_deploy
    target: payments
  - kind: scale_service
    target: payments
  - kind: restart_service
    target: coredns
  - kind: rollback_deploy
    target: checkout
  - kind: disable_feature_flag
    target: checkout
    parameters:
      flag: one-click-checkout
  red_herrings:
  - shipping fails too, at the same moment, for the same kind of lookup
  - checkout v4.9.0 shipped 113 minutes before the alert, and none of its metrics moved after it
  - shipping logs 'session store' errors all window long, before and after
  - payments v6.16.0 shipped 2 minutes before the alert, after its lookups had begun to fail
  - checkout's flag one-click-checkout changed 6 minutes before the alert, and none of its metrics moved
    after it
