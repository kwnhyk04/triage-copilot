  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-1
labels:
  root_cause_class: infrastructure
  service: egress-gateway
  alternatives: []
  onset: -330s
  required_signals:
  - tool: query_metrics
    args:
      query: tcp_connect_errors_per_second{peer="card-network", service="payments"}
    pattern: tcp_connect_errors_per_second\{peer="card-network", service="payments"\}
  - tool: query_logs
    args:
      query: '{service="egress-gateway"}'
    pattern: cluster egress_external
  acceptable_actions: []
  forbidden_actions:
  - kind: rollback_deploy
    target: shipping
  - kind: scale_service
    target: shipping
  - kind: rollback_deploy
    target: checkout
  - kind: disable_feature_flag
    target: checkout
    parameters:
      flag: saved-addresses
  red_herrings:
  - payments fails to connect out at the same moment, to a different provider
  - checkout v7.9.0 shipped 119 minutes before the alert, and none of its metrics moved after it
  - payments logs 'email template promo-weekly has no translation for locale pt-BR' errors all window
    long, before and after
  - checkout's flag saved-addresses changed 2 minutes before the alert, and none of its metrics moved
    after it
