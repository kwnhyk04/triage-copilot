id: dns-partition-4
title: egress-gateway loses its route out
seed: 90852
alert:
  labels:
    alertname: ShippingHighErrorRate
    service: shipping
    severity: critical
  annotations:
    summary: shipping 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="shipping"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: shipping
    op: '>'
    threshold: 0.05
    for: 2m
services:
  checkout:
    depends_on:
    - payments
    - shipping
  payments:
    depends_on:
    - card-network
    - egress-gateway
  shipping:
    depends_on:
    - shipping-api
    - egress-gateway
    - coredns
  card-network: {}
  shipping-api: {}
  egress-gateway: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: checkout
  version: v7.9.0
  previous_version: v7.8.6
  at: -119m
  author: ci-bot
  change: Tune log sampling
background_deploys_days: 7
