id: expired-cert-3
title: carrier-api's certificate expires
seed: 41936
alert:
  labels:
    alertname: ShippingHighErrorRate
    service: shipping
    severity: critical
  annotations:
    summary: shipping 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="shipping"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: shipping
    op: '>'
    threshold: 0.05
    for: 2m
services:
  checkout:
    depends_on:
    - shipping
  shipping:
    depends_on:
