down: dependencies
labels:
  root_cause_class: certificate_expiry
  service: carrier-api
  alternatives: []
  onset: -4m
  required_signals:
  - tool: query_metrics
    args:
      query: tls_handshake_errors_per_second{peer="carrier-api", service="shipping"}
    pattern: tls_handshake_errors_per_second\{peer="carrier-api", service="shipping"\}
  - tool: query_logs
    args:
      query: '{service="shipping", level="error"}'
    pattern: certificate has expired
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: shipping
  - kind: rollback_deploy
    target: shipping
  - kind: rollback_deploy
    target: search
  red_herrings:
  - search v1.9.0 shipped 122 minutes before the alert, and none of its metrics moved after it
  - orders logs 'email template promo-weekly has no translation for locale pt-BR' errors all window long,
    before and after
