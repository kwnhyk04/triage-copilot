  - GET /search/suggest 200 {ms}ms request_id={rid}
- labels:
    service: orders
    level: info
  per_minute: 30
  lines:
  - POST /orders 201 {ms}ms request_id={rid}
  - GET /orders/{n} 200 {ms}ms request_id={rid}
- labels:
    service: orders
    level: info
