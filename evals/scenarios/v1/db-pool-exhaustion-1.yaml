  - 'request failed: PoolTimeoutException request_id={rid}'
  asserts:
  - metric: db_pool_in_use
    labels:
      service: orders
    op: '>='
    value: 49
- labels:
    service: orders-db
    level: info
  per_minute: 4
  lines:
