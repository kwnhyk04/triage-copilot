- labels:
    service: orders-db
    level: info
  per_minute: 2
  from: -9m
  lines:
  - 'long-running transaction pid 48213 open: UPDATE inventory SET reserved = 0 WHERE warehouse_id = 7
    (job inventory-reconcile)'
- labels:
    service: orders-db
    level: warn
  per_minute: 12
  from: -9m
  lines:
  - 'canceling statement due to lock timeout: process {n} waited 5000 ms for ShareLock on transaction
    9183442 of pid 48213'
  - process {n} still waiting for ShareLock on transaction 9183442 after 1000 ms; blocked by pid 48213
- labels:
    service: checkout
    level: error
  per_minute: 8
  from: -5m
  lines:
  - orders returned 500 for POST /orders request_id={rid}
- labels:
    service: catalog
    level: warn
  per_minute: 4
  from: -40m
  to: -25m
  lines:
  - cache miss rate high after cache node catalog-cache-2 restarted
- labels:
    service: search
    level: info
  per_minute: 2
  from: -124m
  to: -123m
  lines:
  - 'Rolling update: pod search-{rid} started version=v4.6.0'
- labels:
    service: checkout
    level: error
  per_minute: 35
  lines:
  - deprecated endpoint /v1/legacy-search called by client mobile-ios/4.{n}
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-4
labels:
  root_cause_class: database
  service: orders-db
  alternatives: []
  onset: -9m
  required_signals:
  - tool: query_logs
    args:
      query: '{service="orders-db"}'
    pattern: pid 48213
  - tool: query_metrics
    args:
      query: db_lock_wait_seconds{service="orders-db"}
    pattern: db_lock_wait_seconds\{service="orders-db"\}
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: orders-db
  - kind: rollback_deploy
    target: orders
  - kind: restart_service
    target: orders
  - kind: scale_service
    target: orders
  - kind: rollback_deploy
    target: search
  red_herrings:
  - orders v3.4.0 shipped 3 hours before the alert, and orders kept a normal error ratio for nearly 3
    hours after it
  - catalog's cache hit ratio dipped 40 to 25 minutes before the alert and recovered before the pool filled
  - Restarting or scaling orders refills the pool while pid 48213 holds the lock on inventory; no allowlisted
    action fixes it, a human ends that transaction
  - search v4.6.0 shipped 124 minutes before the alert, and none of its metrics moved after it
  - checkout logs 'deprecated endpoint /v1/legacy-search called by client mobile-ios/4.' errors all window
    long, before and after
