id: db-pool-exhaustion-1
title: a held lock fills the orders pool
seed: 53543
alert:
  labels:
    alertname: OrdersHighErrorRate
    service: orders
    severity: critical
  annotations:
    summary: orders 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="orders"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: orders
    op: '>'
    threshold: 0.05
    for: 2m
services:
  frontend:
    depends_on:
    - checkout
    - catalog
    - search
  checkout:
    depends_on:
    - orders
  orders:
    depends_on:
    - orders-db
    - coredns
  orders-db: {}
  catalog: {}
  search: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: orders
  version: v3.4.0
  previous_version: v3.3.2
  at: -3h
  author: dev.kim
  change: Add the order export endpoint
- service: search
  version: v4.6.0
  previous_version: v4.5.5
  at: -124m
  author: ci-bot
  change: Bump dependencies
background_deploys_days: 7
