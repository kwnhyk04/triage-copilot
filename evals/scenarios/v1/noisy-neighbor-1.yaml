id: noisy-neighbor-1
title: nightly-reindex starves search
seed: 62182
alert:
  labels:
    alertname: SearchHighLatency
    service: search
    severity: warning
  annotations:
    summary: search p99 latency above 1 s for 3 minutes
    description: http_latency_p99_seconds{service="search"} > 1 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: search
    op: '>'
    threshold: 1.0
    for: 3m
