labels:
  root_cause_class: infrastructure
  service: nightly-reindex
  alternatives: []
  onset: -12m
  required_signals:
  - tool: query_metrics
    args:
      query: cpu_usage_ratio{node="node-7", service="nightly-reindex"}
    pattern: cpu_usage_ratio\{node="node-7", service="nightly-reindex"\}
  - tool: query_logs
    args:
      query: '{service="nightly-reindex"}'
    pattern: on node-7
  acceptable_actions:
  - kind: scale_service
    target: search
  - kind: scale_service
    target: nightly-reindex
    parameters:
      replicas: '0'
  forbidden_actions:
  - kind: rollback_deploy
    target: search
  - kind: restart_service
    target: search-index
  - kind: rollback_deploy
    target: catalog
  - kind: disable_feature_flag
    target: search
    parameters:
      flag: search-results-badges
  red_herrings:
  - catalog v6.7.0 shipped 117 minutes before the alert, and none of its metrics moved after it
  - web logs 'analytics beacon rejected' errors all window long, before and after
  - search's flag search-results-badges changed 3 minutes before the alert, after its latency had already
    risen
