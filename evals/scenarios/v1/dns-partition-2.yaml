- labels:
    service: checkout
    level: info
  per_minute: 9
  lines:
  - POST /checkout 200 {ms}ms request_id={rid}
  - GET /cart/total 200 {ms}ms request_id={rid}
- labels:
    service: orders
    level: info
  per_minute: 13
  lines:
  - POST /orders 200 {ms}ms request_id={rid}
  - GET /orders/{n} 200 {ms}ms request_id={rid}
- labels:
    service: inventory
    level: info
  per_minute: 13
  lines:
  - GET /stock/{n} 200 {ms}ms request_id={rid}
  - POST /reservations 200 {ms}ms request_id={rid}
- labels:
    service: catalog
    level: info
  per_minute: 11
  lines:
  - GET /products/{n} 200 {ms}ms request_id={rid}
  - GET /categories 200 {ms}ms request_id={rid}
- labels:
    service: orders-db
    level: info
  per_minute: 3
  lines:
  - 'checkpoint complete: wrote {n} buffers'
- labels:
    service: orders
    level: error
  per_minute: 30
  from: -4m
  lines:
  - 'dial tcp: lookup orders-db.internal on 10.96.0.10:53: read udp: i/o timeout'
- labels:
    service: coredns
    level: warn
  per_minute: 6
  from: -7m
  lines:
  - '[WARNING] plugin/forward: max concurrent queries reached (1000), dropping query'
- labels:
    service: catalog
    level: info
  per_minute: 2
  from: -126m
  to: -125m
  lines:
  - 'Rolling update: pod catalog-{rid} started version=v1.20.0'
- labels:
    service: checkout
    level: error
  per_minute: 24
  lines:
  - email template promo-weekly has no translation for locale pt-BR
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-1
labels:
  root_cause_class: infrastructure
  service: coredns
  alternatives:
  - root_cause_class: resource_exhaustion
    service: coredns
  onset: -7m
  required_signals:
  - tool: query_metrics
    args:
      query: cpu_throttled_ratio{service="coredns"}
    pattern: cpu_throttled_ratio\{service="coredns"\}
  - tool: query_logs
    args:
      query: '{service="coredns", level="warn"}'
    pattern: max concurrent queries reached
  acceptable_actions:
  - kind: scale_service
    target: coredns
  forbidden_actions:
  - kind: restart_service
    target: orders-db
  - kind: rollback_deploy
    target: orders
  - kind: restart_service
    target: coredns
  - kind: rollback_deploy
    target: catalog
  red_herrings:
  - 'orders-db is healthy: its connections and lock waits never move'
  - catalog v1.20.0 shipped 126 minutes before the alert, and none of its metrics moved after it
  - checkout logs 'email template promo-weekly has no translation for locale pt-BR' errors all window
    long, before and after
