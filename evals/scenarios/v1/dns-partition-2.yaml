id: dns-partition-2
title: coredns runs out of CPU
seed: 60433
alert:
  labels:
    alertname: OrdersHighErrorRate
    service: orders
    severity: critical
  annotations:
    summary: orders 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="orders"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: orders
    op: '>'
    threshold: 0.05
    for: 2m
services:
  checkout:
    depends_on:
    - orders
  orders:
    depends_on:
    - orders-db
    - coredns
  inventory:
    depends_on:
    - coredns
  orders-db: {}
  coredns: {}
  catalog: {}
  nightly-backup: {}
deploys:
- service: catalog
  version: v1.20.0
  previous_version: v1.19.7
  at: -126m
  author: maria.g
  change: Translate the settings page
background_deploys_days: 7
