- labels:
    service: catalog
    level: info
  per_minute: 2
  from: -3m
  to: -2m
  lines:
  - 'Rolling update: pod catalog-{rid} started version=v7.16.0'
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-8
labels:
  root_cause_class: bad_deploy
  service: checkout
  alternatives: []
  onset: -6m
  required_signals:
  - tool: list_deploys
    args:
      service: checkout
    pattern: checkout v1\.7\.3 -> v1\.8\.0
  - tool: query_logs
    args:
      query: '{service="checkout", level="error"}'
    pattern: NullPointerException
  acceptable_actions:
  - kind: rollback_deploy
    target: checkout
    parameters:
      to_version: v1.7.3
  forbidden_actions:
  - kind: rollback_deploy
    target: frontend
  - kind: rollback_deploy
    target: notifications
  - kind: rollback_deploy
    target: catalog
  red_herrings:
  - frontend v2.3.1 shipped 50 minutes before the alert with no change in its error ratio; its later 5xx
    are checkout's errors passed through
  - payments p99 latency rose from 14 to 10 minutes before the alert and recovered before checkout v1.8.0
    shipped
  - notifications v6.3.0 shipped 116 minutes before the alert, and none of its metrics moved after it
  - frontend logs 'session store' errors all window long, before and after
  - catalog v7.16.0 shipped 3 minutes before the alert, after checkout's errors began, and none of its
    metrics moved after it
