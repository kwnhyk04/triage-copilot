id: bad-deploy-1
title: checkout v1.8.0 throws on bundle carts
seed: 95053
alert:
  labels:
    alertname: CheckoutHighErrorRate
    service: checkout
    severity: critical
  annotations:
    summary: checkout 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="checkout"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: checkout
    op: '>'
    threshold: 0.05
    for: 2m
services:
  frontend:
    depends_on:
    - checkout
    - catalog
  checkout:
    depends_on:
    - payments
    - orders-db
    - catalog
    - notifications
    - coredns
  payments: {}
  catalog: {}
  orders-db: {}
  notifications: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: checkout
  version: v1.8.0
  previous_version: v1.7.3
  at: -6m
  author: ci-bot
  change: 'Rework cart total calculation for bundle discounts (PR #4812)'
- service: frontend
  version: v2.3.1
  previous_version: v2.3.0
  at: -50m
  author: ana.lopez
  change: Update header copy
- service: notifications
  version: v6.3.0
  previous_version: v6.2.2
  at: -116m
  author: sam.okafor
  change: Translate the settings page
- service: catalog
  version: v7.16.0
  previous_version: v7.15.5
  at: -3m
  author: renovate-bot
  change: Bump dependencies
background_deploys_days: 7
