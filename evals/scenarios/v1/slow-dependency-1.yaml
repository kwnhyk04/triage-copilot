logs:
- labels:
    service: frontend
    level: info
  per_minute: 9
  lines:
  - GET / 200 {ms}ms request_id={rid}
  - GET /product/{n} 200 {ms}ms request_id={rid}
  - GET /cart 200 {ms}ms request_id={rid}
- labels:
    service: checkout
    level: info
  per_minute: 8
  lines:
  - POST /checkout 200 {ms}ms request_id={rid}
  - GET /cart/total 200 {ms}ms request_id={rid}
- labels:
    service: payments
    level: info
  per_minute: 14
  lines:
  - POST /charge 200 {ms}ms request_id={rid}
  - POST /refund 200 {ms}ms request_id={rid}
- labels:
    service: cart
    level: info
  per_minute: 12
  lines:
  - GET /cart/{n} 200 {ms}ms request_id={rid}
  - POST /cart/{n}/items 200 {ms}ms request_id={rid}
- labels:
    service: search
    level: info
  per_minute: 10
  lines:
  - GET /search 200 {ms}ms request_id={rid}
  - GET /search/suggest 200 {ms}ms request_id={rid}
- labels:
    service: payments-db
    level: info
  per_minute: 3
  lines:
  - 'checkpoint complete: wrote {n} buffers'
- labels:
    service: payments
    level: warn
  per_minute: 30
  from: -5m
  lines:
  - timeout calling card-network after 6000ms (POST /v2/authorize) request_id={rid}
  - card-network answered POST /v2/authorize in 4810ms request_id={rid}
  - card-network answered POST /v2/authorize in 5320ms request_id={rid}
- labels:
    service: search
    level: info
  per_minute: 2
  from: -128m
  to: -127m
  lines:
  - 'Rolling update: pod search-{rid} started version=v1.20.0'
- labels:
    service: cart
    level: error
  per_minute: 29
  lines:
  - deprecated endpoint /v1/legacy-search called by client mobile-ios/4.{n}
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-4
labels:
  root_cause_class: dependency_failure
  service: card-network
  alternatives: []
  onset: -330s
  required_signals:
  - tool: query_metrics
    args:
      query: upstream_latency_p99_seconds{peer="card-network", service="payments"}
    pattern: upstream_latency_p99_seconds\{peer="card-network", service="payments"\}
  - tool: query_logs
    args:
      query: '{service="payments", level="warn"}'
    pattern: card-network
  acceptable_actions: []
  forbidden_actions:
  - kind: scale_service
    target: payments
  - kind: rollback_deploy
    target: payments
  - kind: rollback_deploy
    target: search
  red_herrings:
  - search v1.20.0 shipped 128 minutes before the alert, and none of its metrics moved after it
  - cart logs 'deprecated endpoint /v1/legacy-search called by client mobile-ios/4.' errors all window
    long, before and after
