id: slow-dependency-1
title: card-network slows payments
seed: 30394
alert:
  labels:
    alertname: PaymentsHighLatency
    service: payments
    severity: warning
  annotations:
    summary: payments p99 latency above 2 s for 3 minutes
    description: http_latency_p99_seconds{service="payments"} > 2 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: payments
    op: '>'
    threshold: 2.0
    for: 3m
services:
  frontend:
    depends_on:
    - checkout
  checkout:
    depends_on:
    - payments
    - cart
  payments:
    depends_on:
    - card-network
    - payments-db
    - coredns
  card-network: {}
  payments-db: {}
  cart: {}
  search: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: search
  version: v1.20.0
  previous_version: v1.19.9
  at: -128m
  author: ci-bot
  change: Tune log sampling
background_deploys_days: 7
