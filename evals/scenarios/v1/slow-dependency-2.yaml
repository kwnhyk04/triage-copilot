    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-8
labels:
  root_cause_class: dependency_failure
  service: shipping-api
  alternatives: []
  onset: -330s
  required_signals:
  - tool: query_metrics
    args:
      query: upstream_latency_p99_seconds{peer="shipping-api", service="shipping"}
    pattern: upstream_latency_p99_seconds\{peer="shipping-api", service="shipping"\}
  - tool: query_logs
    args:
      query: '{service="shipping", level="warn"}'
    pattern: carrier shipping-api slow
  acceptable_actions: []
  forbidden_actions:
  - kind: scale_service
    target: shipping
  - kind: restart_service
    target: shipping
  - kind: rollback_deploy
    target: accounts
  - kind: rollback_deploy
    target: checkout
  red_herrings:
  - orders' error ratio rose 45 to 38 minutes before the alert, from a failed export job
  - accounts v1.6.0 shipped 119 minutes before the alert, and none of its metrics moved after it
  - checkout logs 'analytics beacon rejected' errors all window long, before and after
  - checkout v6.9.0 shipped 2 minutes before the alert, after its latency had already risen with shipping's
  - orders's config key orders.export.compression changed 6 minutes before the alert, and none of its
    metrics moved after it
