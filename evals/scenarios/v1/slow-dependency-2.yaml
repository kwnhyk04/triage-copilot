id: slow-dependency-2
title: shipping-api slows shipping
seed: 5984
alert:
  labels:
    alertname: ShippingHighLatency
    service: shipping
    severity: warning
  annotations:
    summary: shipping p99 latency above 3 s for 3 minutes
    description: http_latency_p99_seconds{service="shipping"} > 3 for 3m
  rule:
    metric: http_latency_p99_seconds
    labels:
      service: shipping
    op: '>'
    threshold: 3.0
    for: 3m
services:
  checkout:
    depends_on:
    - shipping
  orders:
    depends_on:
    - shipping
  shipping:
    depends_on:
    - shipping-api
    - coredns
  shipping-api: {}
  accounts: {}
  coredns: {}
  nightly-backup: {}
deploys:
- service: accounts
  version: v1.6.0
  previous_version: v1.5.1
  at: -119m
  author: ci-bot
  change: Bump dependencies
- service: checkout
  version: v6.9.0
  previous_version: v6.8.4
  at: -2m
  author: maria.g
  change: Translate the settings page
background_deploys_days: 7
