id: dns-partition-3
title: coredns crashes on a loop
seed: 96231
alert:
  labels:
    alertname: AccountsHighErrorRate
    service: accounts
    severity: critical
  annotations:
    summary: accounts 5xx ratio above 5% for 2 minutes
    description: http_error_ratio{service="accounts"} > 0.05 for 2m
  rule:
    metric: http_error_ratio
    labels:
      service: accounts
    op: '>'
    threshold: 0.05
    for: 2m
services:
  frontend:
    depends_on:
    - accounts
    - catalog
  accounts:
    depends_on:
    - accounts-db
    - coredns
  catalog:
    depends_on:
    - coredns
  accounts-db: {}
  coredns: {}
  cart: {}
  nightly-backup: {}
