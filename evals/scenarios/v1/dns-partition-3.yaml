- labels:
    service: frontend
    level: error
  per_minute: 24
  lines:
  - invalid coupon code {rid} submitted by {user}
- labels:
    service: nightly-backup
    level: info
  per_minute: 1
  lines:
  - backup of volume pvc-{rid} done on node-2
down: metrics
labels:
  root_cause_class: infrastructure
  service: coredns
  alternatives: []
  onset: -7m
  required_signals:
  - tool: query_logs
    args:
      query: '{service="coredns"}'
    pattern: plugin/loop
  - tool: query_logs
    args:
      query: '{service="accounts", level="error"}'
    pattern: lookup accounts-db\.internal
  acceptable_actions: []
  forbidden_actions:
  - kind: restart_service
    target: accounts-db
  - kind: rollback_deploy
    target: accounts
  - kind: rollback_deploy
    target: cart
  red_herrings:
  - cart v7.12.0 shipped 116 minutes before the alert, and none of its metrics moved after it
  - frontend logs 'invalid coupon code' errors all window long, before and after
