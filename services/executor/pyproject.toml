[project]
name = "executor"
version = "0.1.0"
description = "Runs approved, allowlisted actions; the only service allowed to mutate anything."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.0",
  "py-config",
  "py-telemetry",
  "uvicorn>=0.54.0",
]

[project.scripts]
executor = "executor.main:run"

[tool.uv.sources]
py-config = { workspace = true }
py-telemetry = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
