[project]
name = "agent"
version = "0.1.0"
description = "Consumes investigation requests and investigates with read-only tools."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.0",
  "anthropic>=1.15.0",
  "boto3>=1.43.113",
  "fastapi>=0.143.0",
  "fastembed>=0.8.1",
  "google-genai>=2.27.0",
  "psycopg[binary]>=3.3.6",
  "py-clients",
  "py-config",
  "py-telemetry",
  "sqlalchemy>=2.1.4",
  "uvicorn>=0.54.0",
  # Live triage reads watch's app catalog and masks provider text with its scrubber.
  "watch",
]

[project.scripts]
agent = "agent.main:run"

[tool.uv.sources]
py-clients = { workspace = true }
py-config = { workspace = true }
py-telemetry = { workspace = true }
watch = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
