[project]
name = "watch"
version = "0.1.0"
description = "Polls FreightAudit and FilingLens and posts their state changes to the gateway's webhook."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.0",
  "httpx2>=2.13.1",
  "py-clients",
  "py-config",
  "py-telemetry",
  "uvicorn>=0.54.0",
]

[project.scripts]
watch = "watch.main:run"

[tool.uv.sources]
py-clients = { workspace = true }
py-config = { workspace = true }
py-telemetry = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
