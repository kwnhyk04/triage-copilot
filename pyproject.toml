# uv workspace: every Python service and shared package shares one lockfile and one .venv.
[tool.uv.workspace]
members = ["services/*", "sim", "packages/py-*"]

[dependency-groups]
dev = [
  "agent",
  "executor",
  "sim",
  "py-clients",
  "py-config",
  "py-telemetry",
  "datamodel-code-generator>=0.83.0",
  "httpx2>=2.13.1",
  "pre-commit>=4.7.0",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "ruff>=0.17.0",
  # Lite stubs: no per-service boto3.client overloads, so clients are annotated explicitly.
  "types-boto3-lite[sqs]>=1.43.113",
  "watchfiles>=1.3.0",
  "faker>=40.43.0",
]

[tool.uv.sources]
agent = { workspace = true }
executor = { workspace = true }
sim = { workspace = true }
py-clients = { workspace = true }
py-config = { workspace = true }
py-telemetry = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "ASYNC", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "executor", "sim", "py_clients", "py_config", "py_telemetry"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# datamodel-codegen lints before it formats, and schema descriptions stay on one line.
"**/generated/**" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["services", "sim", "packages/py-*", "scripts"]
# Resolve workspace packages as local source, not as untyped installed libraries.
extraPaths = [
  "services/agent/src",
  "services/executor/src",
  "sim/src",
  "packages/py-clients/src",
  "packages/py-config/src",
  "packages/py-telemetry/src",
]
venvPath = "."
venv = ".venv"

# Default prepend import mode, so test file names must be unique across the repo. Importlib mode
# would register the sim/ folder as a package named `sim` and shadow the real one.
[tool.pytest.ini_options]
testpaths = ["services", "sim", "packages"]
markers = ["integration: needs `make infra-up` and the variables from .env"]

[tool.datamodel-codegen]
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
use-standard-collections = true
use-union-operator = true
use-schema-description = true
use-annotated = true
disable-timestamp = true
formatters = ["ruff-check", "ruff-format"]
