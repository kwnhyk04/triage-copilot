include classpath("application.conf")

# Queue URLs take the host of each request, so they work from the host and from containers.
node-address {
  host = "*"
}

# Queue and message changes go to an H2 file on the elasticmq-data volume, so queued
# investigations survive a container restart.
messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq"
}

# Created at startup. Messages received 5 times without being deleted move to the DLQ.
queues {
  "investigations-dlq.fifo" {
    fifo = true
  }
  "investigations.fifo" {
    fifo = true
    deadLettersQueue {
      name = "investigations-dlq.fifo"
      maxReceiveCount = 5
    }
  }
}
