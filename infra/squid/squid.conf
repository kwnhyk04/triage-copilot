# Production's egress proxy (infra/docker-compose.prod.yml; README, Deploy). The agent, the Tailscale
# sidecar, Alertmanager and its mail relay sit on internal networks and reach the internet only
# through this: CONNECT to the hosts each one needs, on 443 (587 for the mail relay), nothing in a
# private range, nothing cached. Each client has its own port, which serves only that client's
# fixed address. Docker publishes no port from an internal network, so this also carries watch's
# 127.0.0.1:4202 to the gateway, and Prometheus's probe of watch's /readyz to this PC.
http_port 3128 name=agent
http_port 3129 name=tailscale
http_port 3130 name=alertmanager
http_port 3131 name=smtp_relay
# watch's port: every request goes to the gateway's public listener, whatever URL it names.
http_port 4202 accel defaultsite=gateway no-vhost name=watch
# Prometheus's probe of watch (the observability profile): GET /readyz goes to watch on this PC.
http_port 4240 accel defaultsite=watch no-vhost name=watch_probe
# By the gateway's fixed address on `ingress`: squid looks a peer's name up only at start and then
# hourly, so a re-created gateway would get errors until the next lookup.
# login=PASSTHRU forwards the client's Authorization unchanged; without it squid drops the header
# on the way to an originserver peer, and the gateway refused every alert from watch with 401.
cache_peer 10.231.233.34 parent 4200 0 no-query originserver no-digest login=PASSTHRU name=gateway
# watch's own port on this PC, by Docker Desktop's name for it (192.168.65.254), which stays put.
cache_peer host.docker.internal parent 4240 0 no-query originserver no-digest name=watch_host

acl from_agent myportname agent
acl from_tailscale myportname tailscale
acl from_alertmanager myportname alertmanager
acl from_smtp_relay myportname smtp_relay
acl from_watch myportname watch
acl from_watch_probe myportname watch_probe
# Each port serves its client's address alone, so a compromised agent cannot borrow the sidecar's
# way out to Tailscale's servers, the sidecar the agent's to the model providers, or either the
# alert path's to Discord and Gmail. The agent and the sidecar are on `outbound`, the rest on
# `alerting` (infra/docker-compose.prod.yml).
acl agent_ip src 10.231.233.2
acl tailscale_ip src 10.231.233.3
acl alertmanager_ip src 10.231.233.50
acl smtp_relay_ip src 10.231.233.51
acl prometheus_ip src 10.231.233.52
acl https_port port 443
acl smtp_port port 587
acl CONNECT method CONNECT
acl GET method GET
acl readyz urlpath_regex ^/readyz$

# Loopback, private, link-local, CGNAT and other non-public ranges, IPv4 and IPv6. A name is checked
# by every address it resolves to, so host.docker.internal (Docker Desktop's 192.168.65.254) is
# refused like the address itself. Squid keeps IPv4 as IPv4-mapped IPv6, so the IPv4 ranges cover
# mapped addresses too.
acl non_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24
acl non_public dst 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl non_public dst ::/128 ::1/128 64:ff9b::/96 fc00::/7 fe80::/10 ff00::/8

# -n: no lookup, so a bare IP address never matches a name. The agent: the model providers it calls
# (Claude, Gemini, NVIDIA NIM). The sidecar: its control plane and Funnel's certificate, plus its
# relays: with no UDP out, all its traffic rides a relay, and tailscaled measures every region's
# over HTTPS, so one pattern covers any that Tailscale adds. Its log upload is off
# (--no-logs-no-support), so Tailscale's log server is not here. Alertmanager: Discord's webhooks.
# The mail relay: Gmail's submission port, which Alertmanager reaches through it with STARTTLS.
acl agent_hosts dstdomain -n api.anthropic.com generativelanguage.googleapis.com integrate.api.nvidia.com
acl tailscale_hosts dstdomain -n acme-v02.api.letsencrypt.org controlplane.tailscale.com
acl tailscale_derp dstdom_regex -n ^derp[0-9]+[a-z]*[.]tailscale[.]com$
acl alertmanager_hosts dstdomain -n discord.com
acl smtp_relay_hosts dstdomain -n smtp.gmail.com

# Never the cache manager. watch's port forwards to the gateway, and the probe port GET /readyz from
# Prometheus alone to watch (squid answers a CONNECT on either with 405 before any rule);
# everything else is CONNECT from a client's own port and address, on 443 (587 from the mail relay
# alone), to a public address of its hosts.
http_access deny manager
http_access allow from_watch
http_access allow from_watch_probe prometheus_ip GET readyz
http_access deny !CONNECT
http_access deny from_smtp_relay !smtp_port
http_access deny !from_smtp_relay !https_port
http_access deny non_public
http_access allow from_agent agent_ip agent_hosts
http_access allow from_tailscale tailscale_ip tailscale_hosts
http_access allow from_tailscale tailscale_ip tailscale_derp
http_access allow from_alertmanager alertmanager_ip alertmanager_hosts
http_access allow from_smtp_relay smtp_relay_ip smtp_relay_hosts
http_access deny all

# Only watch's requests use the gateway, and only the probe's watch, and they go nowhere else. The
# peers see the proxy's address: no client's X-Forwarded-For passes, and no header names the proxy.
cache_peer_access gateway allow from_watch
cache_peer_access gateway deny all
cache_peer_access watch_host allow from_watch_probe
cache_peer_access watch_host deny all
never_direct allow from_watch
never_direct allow from_watch_probe
forwarded_for delete
via off

# No protocol but the six ports. ICP, HTCP and SNMP default to port 0 already, so these restate
# the defaults; digest generation defaults to on.
icp_port 0
htcp_port 0
snmp_port 0
digest_generation off

# Squid sizes its tables by its descriptor limit, which is Docker's 1,048,576 unless set: that
# idled at 153 MiB of the container's 256. Each tunnel takes two descriptors.
max_filedescriptors 4096

# Tunnels and the forwarded requests only: nothing stored, nothing on disk. Every request is also
# sent to egress-log (the observability profile), which counts the refusals for Prometheus; over
# UDP, one datagram a line, so nothing waits or fails when the profile is off and no one listens.
cache deny all
cache_mem 0 MB
pid_filename none
coredump_dir /tmp
access_log stdio:/dev/stdout
access_log udp://10.231.233.53:5514 buffer-size=0KB
cache_log stdio:/dev/stderr
logfile_rotate 0
visible_hostname egress-proxy
shutdown_lifetime 1 seconds
