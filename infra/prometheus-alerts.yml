# Production's alert rules (the observability profile; docs/guide.md, Alerting). Alertmanager
# sends one message per rule, its alerts listed, to Discord and to the inbox (infra/alertmanager),
# with the rule's own section of docs/alerts.md as its only link. Summaries say what happened and
# what it stops; nothing in them is secret. promtool tests each rule (prometheus-alerts.test.yml).
groups:
  - name: triage-copilot
    rules:
      - alert: GatewayNotReady
        expr: min by (service) (probe_success{service="gateway"}) == 0
        for: 2m
        keep_firing_for: 10m
        labels: { severity: critical }
        annotations:
          summary: 'The gateway is down or fails its readiness check: no alert reaches an investigation, and the web shows the demo.'
          runbook_url: https://github.com/kwnhyk04/triage-copilot/blob/main/docs/alerts.md#gatewaynotready

      # The probe, or the agent's own metrics, which the investigation and Claude rules read.
      - alert: AgentNotReady
        expr: min by (service) (probe_success{service="agent"} or up{job="agent"}) == 0
        for: 2m
        keep_firing_for: 10m
        labels: { severity: critical }
        annotations:
          summary: 'The agent is down, fails its readiness check or serves no metrics: investigations wait in the queue.'
          runbook_url: https://github.com/kwnhyk04/triage-copilot/blob/main/docs/alerts.md#agentnotready

      # watch is ready while its last poll, at most three intervals ago, read and posted everything.
      - alert: WatchNotReady
        expr: min by (service) (probe_success{service="watch"}) == 0
        for: 5m
        keep_firing_for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'watch is down or fails its readiness check: no FreightAudit or FilingLens incident reaches TC.'
          runbook_url: https://github.com/kwnhyk04/triage-copilot/blob/main/docs/alerts.md#watchnotready

      # dlq: a message moved to the dead-letter queue after 5 tries; unreadable: one failed
      # validation. The count covers the last hour, so the alert ends an hour after the last.
      - alert: InvestigationsFailing
        expr: tc_investigations_failed_recent > 0
        labels: { severity: warning }
        annotations:
          summary: '{{ $value }} investigation messages failed in the last hour ({{ $labels.kind }}).'
          runbook_url: https://github.com/kwnhyk04/triage-copilot/blob/main/docs/alerts.md#investigationsfailing

      # Switched off, a rejected key, the credits or TC's monthly cap used up. Not the credits'
      # planned end (LLM_CLAUDE_UNTIL), and today's cap is its own rule.
      - alert: ClaudeOff
        expr: tc_claude_stopped{reason!~"daily_cap|credits_ended"} == 1
        for: 1m
        keep_firing_for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Claude takes no live triage call ({{ $labels.reason }}), so live triage runs on the free models.'
          runbook_url: https://github.com/kwnhyk04/triage-copilot/blob/main/docs/alerts.md#claudeoff

      - alert: ClaudeDailyCapReached
        expr: tc_claude_stopped{reason="daily_cap"} == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Claude has reached today's triage cap (UTC), so live triage runs on the free models until midnight UTC."
          runbook_url: https://github.com/kwnhyk04/triage-copilot/blob/main/docs/alerts.md#claudedailycapreached

      # A plan no model reviewed takes no approval: the reviewer's Claude was off, out of budget or
      # failed, as it is for good once LLM_CLAUDE_UNTIL passes. The count covers the last hour.
      - alert: PlansUnreviewed
        expr: tc_plans_unreviewed_recent > 0
        labels: { severity: warning }
        annotations:
          summary: '{{ $value }} plans arrived in the last hour with no model review, so they cannot be approved.'
          runbook_url: https://github.com/kwnhyk04/triage-copilot/blob/main/docs/alerts.md#plansunreviewed

      # A rise of egress-log's count, or the count appearing: it has no series before the first
      # refusal since egress-log started.
      - alert: EgressDenied
        expr: >-
          increase(tc_egress_denied_total[10m]) > 0
          or (tc_egress_denied_total unless tc_egress_denied_total offset 10m)
        labels: { severity: warning }
        annotations:
          summary: 'The egress proxy refused a request in the last 10 minutes: a container asked for a host, port or path outside its allowlist.'
          runbook_url: https://github.com/kwnhyk04/triage-copilot/blob/main/docs/alerts.md#egressdenied

      # Without the probe exporter, egress-log, the gateway's metrics or Alertmanager's, the
      # readiness, refusal, verdict, waiting-plan and delivery rules cannot fire.
      - alert: MonitoringBlind
        expr: up{job=~"readyz|egress-log|gateway|alertmanager"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Prometheus cannot read {{ $labels.job }}, so the rules that need it stay silent.'
          runbook_url: https://github.com/kwnhyk04/triage-copilot/blob/main/docs/alerts.md#monitoringblind

      # Alertmanager gave up on a message, after its retries. The channel that still works carries
      # this one, so each reports the other's failures; if both fail, only Prometheus shows it.
      - alert: AlertDeliveryFailing
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: 'Alertmanager gave up on a message to {{ $labels.integration }} in the last 15 minutes, so an alert may never have arrived there.'
          runbook_url: https://github.com/kwnhyk04/triage-copilot/blob/main/docs/alerts.md#alertdeliveryfailing

      # A verdict and a plan that waits for a person: notify routes each to one Discord message with
      # a link to its report (infra/alertmanager), no email and no reminder. A series lasts an hour
      # (apps/gateway/src/metrics.ts). Its labels hold an id, an app and closed lists, so nothing a
      # model wrote reaches Discord.
      - alert: InvestigationVerdict
        expr: tc_investigation_verdict == 1
        labels: { severity: warning, notify: report }
        annotations:
          summary: '{{ if eq $labels.verdict "real" }}Real incident{{ else }}Not a real incident{{ end }} on {{ $labels.app }}: {{ $labels.cause }}'
          report_url: '{{ $labels.report }}'
          runbook_url: https://github.com/kwnhyk04/triage-copilot/blob/main/docs/alerts.md#investigationverdict

      - alert: PlanWaiting
        expr: tc_plan_waiting == 1
        labels: { severity: warning, notify: report }
        annotations:
          summary: 'A plan on {{ $labels.app }} waits for a decision'
          report_url: '{{ $labels.report }}'
          runbook_url: https://github.com/kwnhyk04/triage-copilot/blob/main/docs/alerts.md#planwaiting
