# Production's Prometheus (the observability profile; infra/docker-compose.prod.yml): the agent's
# metrics, the readiness probes, Alertmanager's own and egress-log's count of the proxy's refusals,
# judged by the rules in prometheus-alerts.yml, whose alerts go to Alertmanager. docs/alerts.md
# says what each means.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # Failed investigations, and why live triage's Claude takes no call (agent/metrics.py).
  - job_name: agent
    static_configs:
      - targets: [agent:4210]
        labels: { service: agent }
  # Live verdicts and waiting plans, on the gateway's internal listener (src/metrics.ts).
  - job_name: gateway
    static_configs:
      - targets: [gateway:4201]
        labels: { service: gateway }
  # Each /readyz, through the probe exporter on this container's loopback. watch runs on the host,
  # which only the egress proxy reaches: its probe port forwards GET /readyz there.
  - job_name: readyz
    metrics_path: /probe
    params: { module: [readyz] }
    static_configs:
      - targets: [http://gateway:4200/readyz]
        labels: { service: gateway }
      - targets: [http://agent:4210/readyz]
        labels: { service: agent }
      - targets: [http://egress-proxy:4240/readyz]
        labels: { service: watch }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
  # Alertmanager's own counts, which show a message it gave up on (AlertDeliveryFailing).
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  # The proxy's refusals, counted from its access log.
  - job_name: egress-log
    static_configs:
      - targets: [egress-log:8889]
  # The apps' own OTLP metrics, as in dev (infra/prometheus.yml).
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
