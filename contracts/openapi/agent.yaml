openapi: 3.1.0
info:
  title: Triage Copilot agent
  version: 0.4.0
  description: >-
    Internal API of the agent service. Only other backend services call it, with the service
    token. Errors are RFC 9457 Problem Details (application/problem+json).
security:
  - serviceToken: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe.
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe. Checks Postgres and the investigations queue.
      security: []
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A dependency is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /metrics:
    get:
      operationId: getMetrics
      summary: >-
        Prometheus's view of the agent, in its text format (version 0.0.4): the investigation
        messages that failed in the last hour (tc_investigations_failed_recent, by kind), and,
        while live triage's Claude takes no call, why (tc_claude_stopped, by reason).
      security: []
      responses:
        '200':
          description: The metrics.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: Postgres is unreachable, so no number is served.
  /internal/investigations/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/InvestigationId'
    post:
      operationId: cancelInvestigation
      summary: Asks the agent loop to stop at its next checkpoint. Repeating it is harmless.
      responses:
        '202':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The investigation already resolved or failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/investigations/{id}/state:
    parameters:
      - $ref: '#/components/parameters/InvestigationId'
    get:
      operationId: getInvestigationState
      summary: Progress of one investigation, read from its latest checkpoint.
      responses:
        '200':
          description: The latest checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: >-
        Token shared by backend services only; distinct from the gateway API key and the
        Alertmanager token.
  parameters:
    InvestigationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: The service token is missing or invalid.
      headers:
        WWW-Authenticate:
          description: The Bearer challenge.
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token is valid but not allowed on this route.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No investigation has this id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Problem:
      type: object
      description: RFC 9457 Problem Details. Extension members may appear.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Identifies the problem type.
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
    InvestigationStatus:
      type: string
      enum: [queued, running, awaiting_approval, resolved, failed, cancelled]
    WaitReason:
      type: string
      enum: [tenant_cap, budget]
      description: >-
        What a parked investigation waits for. tenant_cap: a slot under its tenant's cap of
        investigations running at once. budget: model calls, which are off or out of today's
        token budget.
    InvestigationState:
      type: object
      required:
        - investigation_id
        - status
        - cancel_requested
        - steps_taken
        - tool_calls
        - tokens_used
        - updated_at
        - waiting_for
        - waiting_since
        - resumable
      properties:
        investigation_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/InvestigationStatus'
        cancel_requested:
          type: boolean
          description: True once a cancel arrived; the loop stops at its next checkpoint.
        steps_taken:
          type: integer
          minimum: 0
        tool_calls:
          type: integer
          minimum: 0
        tokens_used:
          type: integer
          minimum: 0
          description: Model tokens spent so far, input and output combined.
        updated_at:
          type: string
          format: date-time
          description: Time of the latest checkpoint.
        waiting_for:
          description: >-
            Set while the investigation is parked: its status is queued, its message was deleted,
            and the gateway's recovery sweeper re-queues it. Null otherwise.
          anyOf:
            - $ref: '#/components/schemas/WaitReason'
            - type: 'null'
        waiting_since:
          type: [string, 'null']
          format: date-time
          description: When the investigation last parked; null unless waiting_for is set.
        resumable:
          type: boolean
          description: >-
            True when a parked investigation can run now: model calls are available again, or a
            slot under its tenant's cap is free and no investigation of that tenant parked for one
            before it.
