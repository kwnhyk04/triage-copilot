openapi: 3.1.0
info:
  title: Triage Copilot gateway
  version: 0.6.0
  description: >-
    REST endpoints of the gateway. The GraphQL API is contracts/graphql/schema.graphql. Errors are
    RFC 9457 Problem Details (application/problem+json). Every /v1 route needs credentials: the
    Alertmanager webhook takes the tenant's bearer token, approve and reject take X-Approver-Key,
    every other route the X-API-Key header. /graphql takes the same X-API-Key. Requests are rate
    limited per credential, or per client address without one. The /internal routes are served
    only on a separate listener bound to 127.0.0.1 (the internal Docker network in production),
    which the public listener does not expose; only the executor and the agent call them, each
    with its own token.
security:
  - apiKey: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe.
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe. Checks Postgres.
      security: []
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A dependency is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/alerts:
    post:
      operationId: postAlerts
      summary: Alertmanager webhook intake.
      description: >-
        Takes the Prometheus Alertmanager webhook payload (version 4) and acknowledges it at once;
        investigation runs asynchronously. Alerts already seen with the same fingerprint and status
        are deduplicated. New alerts join the group of the same groupKey whose 5-minute window
        opened last, or open a new group. A new group with a firing alert queues one investigation,
        unless the tenant already started the gateway's limit (5 by default) in the last 5 minutes;
        then the group is kept without one. The body may hold at most 1 MB and 200 alerts.
      security:
        - alertmanagerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertmanagerWebhook'
            examples:
              firing:
                summary: One firing alert
                externalValue: examples/alertmanager-webhook.json
      responses:
        '202':
          description: Accepted for grouping and investigation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/investigations:
    get:
      operationId: listInvestigations
      summary: Lists investigations, newest first, with keyset pagination.
      parameters:
        - name: limit
          in: query
          description: Page size; outside 1 to 100 gets 400.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          description: The next_cursor of the previous page; omit for the first page.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        '200':
          description: One page of investigations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/investigations/{id}:
    parameters:
      - $ref: '#/components/parameters/InvestigationId'
    get:
      operationId: getInvestigation
      summary: One investigation with its hypotheses, proposed actions and steps.
      description: >-
        The investigation as its alert group, report and steps hold it. A live tenant's steps, and
        with them its evidence excerpts and step tokens, are purged 30 days after they were stored;
        the report, verdict and models stay.
      responses:
        '200':
          description: The investigation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/actions/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/ActionId'
    post:
      operationId: approveAction
      summary: Records a human approval; only then may the executor run the action.
      security:
        - approverKey: []
      requestBody:
        $ref: '#/components/requestBodies/Decision'
      responses:
        '200':
          $ref: '#/components/responses/Decided'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApproverKeyRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyDecided'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/actions/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ActionId'
    post:
      operationId: rejectAction
      summary: Records a human rejection; the action never runs.
      security:
        - approverKey: []
      requestBody:
        $ref: '#/components/requestBodies/Decision'
      responses:
        '200':
          $ref: '#/components/responses/Decided'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApproverKeyRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyDecided'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /internal/actions/{id}/execution:
    servers:
      - url: http://127.0.0.1:4201
        description: >-
          The internal listener (GATEWAY_INTERNAL_HOST and GATEWAY_INTERNAL_PORT). The public
          listener answers 404 here.
    parameters:
      - $ref: '#/components/parameters/ActionId'
    post:
      operationId: claimExecution
      summary: Claims an approved action for the executor, once.
      description: >-
        Inserts the execution in one transaction. Only an action whose decision is approved can be
        claimed: the database refuses any other. The action id is the idempotency key, so a second
        claim returns the first one with 200, and the executor must not run the action again. An
        execution left in claimed is never retried; it waits for a human.
      security:
        - executorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionClaim'
      responses:
        '201':
          description: Claimed now. The executor runs the action, or in a dry run only plans it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '200':
          description: Claimed before. The executor must not run the action again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ExecutorUnauthorized'
        '404':
          description: No approved action has this id; it is unknown, pending or rejected.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/actions/{id}/execution/result:
    servers:
      - url: http://127.0.0.1:4201
        description: The internal listener; the public listener answers 404 here.
    parameters:
      - $ref: '#/components/parameters/ActionId'
    post:
      operationId: reportExecutionResult
      summary: Records how a claimed execution ended. Each execution takes one result.
      security:
        - executorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionResult'
      responses:
        '200':
          description: The result was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ExecutorUnauthorized'
        '404':
          description: No execution has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The execution already has its result.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/investigations/{id}/alerts:
    servers:
      - url: http://127.0.0.1:4201
        description: The internal listener; the public listener answers 404 here.
    parameters:
      - $ref: '#/components/parameters/InvestigationId'
    get:
      operationId: getAlertContext
      summary: The alert group behind an investigation, for the agent's get_alert_context tool.
      description: >-
        Read only. Returns the group's 200 oldest alerts as the gateway stored them (labels,
        annotations from 0.5.0 on, start and status) and how many it holds in all.
      security:
        - agentToken: []
      responses:
        '200':
          description: The alert group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '404':
          description: No alert group has this investigation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Server-only key held by the web backend-for-frontend and backend jobs. Browsers never
        send it. It cannot approve or reject.
    approverKey:
      type: apiKey
      in: header
      name: X-Approver-Key
      description: >-
        APPROVER_API_KEY, held only by the web app's server, which sends it when a human approves
        or rejects an action. The agent, executor and sim never receive it. Valid on approve and
        reject only.
    alertmanagerToken:
      type: http
      scheme: bearer
      description: >-
        A tenant's own secret, set as the bearer credentials in its Alertmanager webhook
        http_config. It identifies the tenant; the gateway stores only its SHA-256. Valid on POST
        /v1/alerts only.
    executorToken:
      type: http
      scheme: bearer
      description: >-
        EXECUTOR_SERVICE_TOKEN, held only by the gateway and the executor and distinct from the
        agent's service token. Valid on the internal listener's /internal/actions routes only.
    agentToken:
      type: http
      scheme: bearer
      description: >-
        AGENT_SERVICE_TOKEN, held only by the gateway and the agent; the gateway also sends it to
        the agent's internal API. Valid on GET /internal/investigations/{id}/alerts only.
  parameters:
    InvestigationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    Decision:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Decision'
  headers:
    WWW-Authenticate:
      description: >-
        The challenge for the route's credential: Bearer on POST /v1/alerts, ApiKey
        header="X-Approver-Key" on approve and reject, ApiKey header="X-API-Key" elsewhere.
      required: true
      schema:
        type: string
    RateLimit-Limit:
      description: Requests allowed in the current window.
      required: true
      schema:
        type: integer
        minimum: 0
    RateLimit-Remaining:
      description: Requests left in the current window.
      required: true
      schema:
        type: integer
        minimum: 0
    Retry-After:
      description: Seconds to wait before retrying.
      required: true
      schema:
        type: integer
        minimum: 0
  responses:
    Decided:
      description: The decision was recorded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProposedAction'
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Credentials are missing or invalid.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AgentUnauthorized:
      description: The agent service token is missing or invalid.
      headers:
        WWW-Authenticate:
          description: The Bearer challenge.
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ExecutorUnauthorized:
      description: The executor service token is missing or invalid.
      headers:
        WWW-Authenticate:
          description: The Bearer challenge.
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The credentials are valid but not allowed on this route.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No resource has this id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ApproverKeyRequired:
      description: >-
        Another gateway credential (X-API-Key or the Alertmanager token) was sent instead of
        X-Approver-Key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AlreadyDecided:
      description: The action was already approved or rejected.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The body is over 1 MB.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded. Retry after Retry-After seconds.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: >-
        The gateway is shedding load or a dependency is down. Retry after Retry-After seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Problem:
      type: object
      description: RFC 9457 Problem Details. Extension members may appear.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Identifies the problem type.
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
    AlertmanagerWebhook:
      type: object
      description: >-
        Prometheus Alertmanager webhook payload, version 4. Unknown members are ignored, so
        Alertmanager upgrades that add fields do not break intake.
      required:
        - version
        - groupKey
        - status
        - receiver
        - groupLabels
        - commonLabels
        - commonAnnotations
        - externalURL
        - alerts
      properties:
        version:
          type: string
          const: '4'
        groupKey:
          type: string
          minLength: 1
          description: Identifies the alert group.
        truncatedAlerts:
          type: integer
          minimum: 0
          default: 0
          description: Alerts left out because of the receiver's max_alerts.
        status:
          $ref: '#/components/schemas/AlertStatus'
        receiver:
          type: string
        groupLabels:
          $ref: '#/components/schemas/Labels'
        commonLabels:
          $ref: '#/components/schemas/Labels'
        commonAnnotations:
          $ref: '#/components/schemas/Labels'
        externalURL:
          type: string
          description: Backlink to the Alertmanager.
        alerts:
          type: array
          minItems: 1
          description: >-
            At most 200; larger payloads get 400. Set max_alerts to 200 in Alertmanager's
            webhook_config so it truncates bigger groups and reports truncatedAlerts.
          items:
            $ref: '#/components/schemas/Alert'
    Alert:
      type: object
      required: [status, labels, annotations, startsAt, endsAt, generatorURL, fingerprint]
      properties:
        status:
          $ref: '#/components/schemas/AlertStatus'
        labels:
          $ref: '#/components/schemas/Labels'
        annotations:
          $ref: '#/components/schemas/Labels'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: 0001-01-01T00:00:00Z while the alert fires.
        generatorURL:
          type: string
          description: Link to the rule that fired.
        fingerprint:
          type: string
          minLength: 1
          description: >-
            Alertmanager's fingerprint of the labels. The gateway computes its own with the same
            algorithm (Prometheus's LabelSet fingerprint) and deduplicates on that; a payload whose
            value differs is accepted, and the mismatch is logged.
    AlertStatus:
      type: string
      enum: [firing, resolved]
    AlertContext:
      type: object
      description: An investigation's alert group as the gateway stored it.
      required:
        - investigation_id
        - group_id
        - tenant_id
        - group_key
        - window_start
        - severity
        - alert_count
        - alerts
      properties:
        investigation_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        group_key:
          type: string
          description: Alertmanager's groupKey.
        window_start:
          type: string
          format: date-time
          description: When the group's 5-minute grouping window opened.
        severity:
          type: string
          enum: [critical, warning, info]
        alert_count:
          type: integer
          minimum: 0
          description: Alerts the group holds; alerts lists at most 200 of them.
        alerts:
          type: array
          description: Oldest first, at most 200.
          items:
            $ref: '#/components/schemas/StoredAlert'
    StoredAlert:
      type: object
      required: [fingerprint, labels, starts_at, status]
      properties:
        fingerprint:
          type: string
          description: The fingerprint the gateway computed from the labels.
        labels:
          $ref: '#/components/schemas/Labels'
        annotations:
          $ref: '#/components/schemas/Labels'
          description: The annotations the alert arrived with; absent for alerts stored before they were kept (0.5.0).
        starts_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AlertStatus'
    Labels:
      type: object
      description: String map, used for labels and annotations.
      additionalProperties:
        type: string
    AlertAccepted:
      type: object
      required: [group_id, deduped]
      properties:
        group_id:
          type: string
          format: uuid
          description: Alert group the payload was added to.
        deduped:
          type: boolean
          description: >-
            True when every alert was already known with the same fingerprint and status, so
            nothing new was queued.
    InvestigationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvestigationSummary'
        next_cursor:
          type: [string, 'null']
          description: Pass as cursor to read the next page; null on the last page.
    InvestigationStatus:
      type: string
      enum: [queued, running, awaiting_approval, resolved, failed, cancelled]
    InvestigationSummary:
      type: object
      required: [id, group_id, title, status, verdict, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
          description: Alert group that triggered the investigation.
        title:
          type: string
        status:
          $ref: '#/components/schemas/InvestigationStatus'
        verdict:
          description: >-
            A live triage's verdict; null until the report, for a simulated incident, for a report
            the agent wrote itself after a stop, and for reports recorded before verdicts existed.
            not_real never hides the alert.
          anyOf:
            - $ref: '#/components/schemas/Verdict'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Verdict:
      type: string
      description: Whether a live alert shows an incident a human must look at.
      enum: [real, not_real]
    Investigation:
      allOf:
        - $ref: '#/components/schemas/InvestigationSummary'
        - type: object
          required:
            - summary
            - tokens_used
            - hypotheses
            - missing_evidence
            - partial
            - models
            - proposed_actions
            - steps
          properties:
            summary:
              type: [string, 'null']
              description: Final report summary; null until the investigation ends.
            tokens_used:
              type: integer
              minimum: 0
              description: >-
                Model tokens of the investigation's turns, input and output combined, as its stored
                steps record them.
            hypotheses:
              type: array
              description: Best first.
              items:
                $ref: '#/components/schemas/Hypothesis'
            missing_evidence:
              type: array
              description: >-
                Evidence the agent could not get, such as a tool that failed; empty until the
                report.
              items:
                type: string
            partial:
              type: boolean
              description: >-
                True when the agent stopped before the model reported, at a limit, and wrote the
                report itself; false until the report.
            models:
              type: array
              description: >-
                Every model asked, per part of the work, in the order first asked; empty until the
                report, and for reports recorded before models were listed.
              items:
                $ref: '#/components/schemas/ModelUse'
            proposed_actions:
              type: array
              items:
                $ref: '#/components/schemas/ProposedAction'
            steps:
              type: array
              description: In execution order.
              items:
                $ref: '#/components/schemas/Step'
    ModelUse:
      type: object
      description: A model asked during an investigation, for one part of the work.
      required: [part, provider, model, calls, failed, reason]
      properties:
        part:
          $ref: '#/components/schemas/ModelPart'
        provider:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 200
        calls:
          type: integer
          minimum: 0
          description: Requests it answered.
        failed:
          type: integer
          minimum: 0
          description: >-
            Requests it did not answer, and requests the agent skipped before they reached it.
        reason:
          type: [string, 'null']
          maxLength: 500
          description: >-
            Why the last of those failed or was skipped; null when it answered every request.
    ModelPart:
      type: string
      description: "triage: the investigation's turns; summary: log page summaries."
      enum: [triage, summary]
    Hypothesis:
      type: object
      required: [rank, root_cause_class, service, summary, confidence, evidence]
      properties:
        rank:
          type: integer
          minimum: 1
          description: 1 is the most likely root cause.
        root_cause_class:
          $ref: '#/components/schemas/RootCauseClass'
        service:
          type: string
          description: The service where the root cause lives.
        summary:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
    RootCauseClass:
      type: string
      description: Fixed root-cause classes, so evals compare classes instead of free text.
      enum:
        - bad_deploy
        - config_change
        - dependency_failure
        - resource_exhaustion
        - traffic_surge
        - database
        - infrastructure
        - certificate_expiry
        - unknown
    Evidence:
      type: object
      description: An excerpt of a tool result that supports a hypothesis.
      required: [tool_call_id, excerpt]
      properties:
        tool_call_id:
          type: string
          description: Id of the tool result the excerpt comes from.
        excerpt:
          type: string
          maxLength: 2000
          description: >-
            The start of the tool result; empty when the gateway has no result for the id, as once
            a live investigation's steps are purged after 30 days.
    ProposedAction:
      type: object
      description: >-
        A remediation the agent proposes. Only the executor runs it, and only after a human
        approves it.
      required:
        - id
        - investigation_id
        - kind
        - target
        - parameters
        - rationale
        - status
        - proposed_at
        - decided_by
        - decided_at
        - decision_reason
      properties:
        id:
          type: string
          format: uuid
        investigation_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ActionKind'
        target:
          type: string
          description: Service the action applies to.
        parameters:
          type: object
          description: 'Kind-specific arguments, for example {"to_version": "v1.7.3"}.'
          additionalProperties:
            type: [string, integer, number, boolean]
        rationale:
          type: string
        status:
          $ref: '#/components/schemas/ActionStatus'
        proposed_at:
          type: string
          format: date-time
        decided_by:
          type: [string, 'null']
          description: Approver identity; null while pending.
        decided_at:
          type: [string, 'null']
          format: date-time
        decision_reason:
          type: [string, 'null']
    ActionKind:
      type: string
      description: Allowlisted action kinds.
      enum: [rollback_deploy, restart_service, scale_service, disable_feature_flag]
    ActionStatus:
      type: string
      enum: [pending, approved, rejected]
    ExecutionClaim:
      type: object
      additionalProperties: false
      required: [dry_run]
      properties:
        dry_run:
          type: boolean
          description: >-
            True when the executor only plans the action. The claim is used up either way, so an
            old approval never runs later.
    ExecutionOutcome:
      type: string
      enum: [succeeded, failed]
    ExecutionResult:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/ExecutionOutcome'
        detail:
          type: string
          maxLength: 2000
          description: A dry run's plan, or why the action failed.
    ExecutionState:
      type: string
      description: >-
        claimed: the executor took the action and has not reported how it ended. succeeded and
        failed are final. No execution is retried automatically.
      enum: [claimed, succeeded, failed]
    Execution:
      type: object
      description: The executor's claim on an approved action, with the action as approved.
      required:
        - action_id
        - kind
        - target
        - parameters
        - approved_by
        - approved_at
        - state
        - dry_run
        - detail
        - claimed_at
        - finished_at
      properties:
        action_id:
          type: string
          format: uuid
          description: The approved action; also the idempotency key.
        kind:
          $ref: '#/components/schemas/ActionKind'
        target:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: [string, integer, number, boolean]
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/ExecutionState'
        dry_run:
          type: boolean
        detail:
          type: [string, 'null']
        claimed_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    Decision:
      type: object
      additionalProperties: false
      required: [approver]
      properties:
        approver:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Identity of the human deciding, as authenticated by the web backend-for-frontend
            (for example an email address).
        reason:
          type: string
          maxLength: 2000
          description: Optional note recorded with the decision.
    Step:
      type: object
      description: One step of the agent loop.
      required: [seq, kind, summary, tool_call, recorded_at]
      properties:
        seq:
          type: integer
          minimum: 1
          description: Position in the investigation, starting at 1.
        kind:
          $ref: '#/components/schemas/StepKind'
        summary:
          type: string
        tool_call:
          description: Set on tool_call steps once the call has returned.
          anyOf:
            - $ref: '#/components/schemas/ToolCall'
            - type: 'null'
        recorded_at:
          type: string
          format: date-time
    StepKind:
      type: string
      enum: [tool_call, hypothesis, action, report]
    ToolCall:
      type: object
      required: [id, name, status, duration_ms]
      properties:
        id:
          type: string
          description: Id of the tool result; evidence cites it.
        name:
          type: string
        status:
          $ref: '#/components/schemas/ToolCallStatus'
        duration_ms:
          type: integer
          minimum: 0
    ToolCallStatus:
      type: string
      enum: [ok, error, timeout]
